<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biometric & Local Card OCR Demo</title>
  
  <!-- Tesseract.js v5 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    .card-box { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 450px; margin: auto; }
    video, canvas { width: 100%; border-radius: 6px; background: #000; }
    button { width: 100%; padding: 12px; margin-top: 10px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .output { background: #2b2b2b; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="card-box">
  <h2>Zero-Server Card Reader</h2>
  
  <video id="video" autoplay playsinline></video>
  <button id="snap-btn">1. Snap & Read Card</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="output" id="ocr-status">Status: Ready</div>
  <div class="output" id="card-data">Card Info: Waiting...</div>

  <button id="pay-btn" style="background:#007bff; margin-top:15px;" disabled>2. Pay with Fingerprint (WebAuthn)</button>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const statusDiv = document.getElementById('ocr-status');
  const cardDiv = document.getElementById('card-data');
  const payBtn = document.getElementById('pay-btn');

  // Start Camera Feed
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { statusDiv.innerText = "Camera error: " + err.message; });

  // Snap Frame & Perform Local OCR
  document.getElementById('snap-btn').addEventListener('click', async () => {
    statusDiv.innerText = "Status: Capturing frame...";
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    statusDiv.innerText = "Status: Initializing Tesseract WebAssembly...";

    try {
      // 1. Create WebAssembly Worker
      const worker = await Tesseract.createWorker('eng');
      
      statusDiv.innerText = "Status: Scanning card locally...";
      const ret = await worker.recognize(canvas);
      await worker.terminate();

      const rawText = ret.data.text;
      statusDiv.innerText = "Status: Scan Complete!";

      // 2. Parse 16-digit card number using Regex
      const digitsOnly = rawText.replace(/\D/g, '');
      const cardMatch = rawText.match(/\b(?:\d[ -]*?){13,16}\b/);
      
      // 3. Parse Expiration Date (MM/YY)
      const expiryMatch = rawText.match(/\b(0[1-9]|1[0-2])\/([0-9]{2})\b/);

      cardDiv.innerText = `
--- PARSED RESULTS ---
Card Number : ${cardMatch ? cardMatch[0].replace(/\s+/g, '') : 'Not detected'}
Expiry Date : ${expiryMatch ? expiryMatch[0] : 'Not detected'}

--- RAW OCR OUTPUT ---
${rawText}
      `.trim();

      // Enable Fingerprint Payment Button
      payBtn.disabled = false;

    } catch (err) {
      statusDiv.innerText = "OCR Error: " + err.message;
    }
  });

  // Fingerprint WebAuthn Trigger
  payBtn.addEventListener('click', async () => {
    try {
      // Fetch challenge from your Cloudflare Worker endpoint
      const res = await fetch("https://hidden-cake-9572.trustconnect713.workers.dev/api/auth/challenge");
      const { challenge } = await res.json();

      // Convert Base64 URL Challenge string to Uint8Array
      const challengeBuffer = Uint8Array.from(atob(challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

      // Trigger OS Biometric / Fingerprint Prompt
      const credential = await navigator.credentials.get({
        publicKey: {
          challenge: challengeBuffer,
          timeout: 60000,
          userVerification: "required"
        }
      });

      alert("Payment Cryptographically Signed via Biometrics!");
      console.log("WebAuthn Signature Payload:", credential);

    } catch (err) {
      alert("Biometric verification failed: " + err.message);
    }
  });
</script>

</body>
</html>
