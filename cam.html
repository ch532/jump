<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solar AI Camera Node</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Full-Screen Video Background */
    #localVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    /* Top Floating Status Overlay */
    .overlay-top {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .status-badge.connecting {
      background-color: rgba(133, 77, 14, 0.85);
      color: #fef08a;
      border: 1px solid rgba(254, 240, 138, 0.3);
    }

    .status-badge.online {
      background-color: rgba(22, 101, 52, 0.85);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-badge.alert {
      background-color: rgba(153, 27, 27, 0.9);
      color: #fca5a5;
      border: 1px solid rgba(252, 165, 165, 0.4);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.85; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* Bottom Floating HUD Overlay */
    .overlay-bottom {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }

    .hud-item strong {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Element -->
  <video id="localVideo" autoplay playsinline muted></video>

  <!-- Top Status Badge Overlay -->
  <div class="overlay-top">
    <div id="statusBadge" class="status-badge connecting">Initializing System...</div>
  </div>

  <!-- Bottom Details Overlay -->
  <div class="overlay-bottom">
    <div class="hud-item">AI: <strong>connectgold-gateway</strong></div>
    <div class="hud-item">SIGNAL: <strong>signal.chyke.online</strong></div>
  </div>

  <script>
    const WORKER_GATEWAY_URL = 'https://orange-field-e94b.trustconnect713.workers.dev/';
    const SIGNALING_URL = 'wss://signal.chyke.online';

    const videoElement = document.getElementById('localVideo');
    const statusBadge = document.getElementById('statusBadge');

    let localStream = null;
    let ws = null;
    let peerConnection = null;

    const iceConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    // 1. Initialize Camera Hardware Stream
    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      } catch (err) {
        // Fallback to standard/front camera
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      }
      videoElement.srcObject = localStream;
    }

    // 2. Connect to WebSockets Signaling Server
    function connectSignaling() {
      ws = new WebSocket(SIGNALING_URL);

      ws.onopen = () => {
        statusBadge.innerText = 'Camera Ready & Registered';
        statusBadge.className = 'status-badge online';
        ws.send(JSON.stringify({ type: 'register_camera' }));
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'offer') {
          peerConnection = new RTCPeerConnection(iceConfig);

          if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
          }

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) {
              ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
            }
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          ws.send(JSON.stringify({ type: 'answer', answer: answer }));
        } else if (data.type === 'ice-candidate' && peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };

      ws.onclose = () => {
        statusBadge.innerText = 'Signaling Disconnected';
        statusBadge.className = 'status-badge connecting';
        setTimeout(connectSignaling, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // 3. Capture Frame and Send to Cloudflare AI Gateway
    async function sendFrameToCloudflareAI() {
      if (!videoElement || videoElement.readyState !== 4) return;

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        try {
          const response = await fetch(WORKER_GATEWAY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg' },
            body: blob
          });

          const result = await response.json();

          if (result.alert) {
            statusBadge.innerText = `⚠️ TARGET DETECTED (${result.detected_count})`;
            statusBadge.className = 'status-badge alert';

            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'ai_alert', count: result.detected_count, objects: result.objects }));
            }
          } else {
            statusBadge.innerText = 'AI Active - Clear';
            statusBadge.className = 'status-badge online';
          }
        } catch (err) {
          console.error('Cloudflare AI Inference Error:', err);
        }
      }, 'image/jpeg', 0.8);
    }

    // Application Entry Point
    async function init() {
      await startCamera();
      connectSignaling();
      setInterval(sendFrameToCloudflareAI, 3000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
