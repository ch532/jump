<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solar AI Camera Node</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Full-Screen Video Background */
    #localVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    /* Top Floating Status Bar */
    .overlay-top {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* AI Badge States */
    .status-badge.ai-clear {
      background-color: rgba(22, 101, 52, 0.85);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-badge.ai-alert {
      background-color: rgba(153, 27, 27, 0.9);
      color: #fca5a5;
      border: 1px solid rgba(252, 165, 165, 0.4);
      animation: pulse 1s infinite alternate;
    }

    /* Signaling Badge States */
    .status-badge.sig-online {
      background-color: rgba(15, 23, 42, 0.75);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-badge.sig-offline {
      background-color: rgba(133, 77, 14, 0.85);
      color: #fef08a;
      border: 1px solid rgba(254, 240, 138, 0.3);
    }

    @keyframes pulse {
      from { opacity: 0.85; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* Center Right Media Capture Controls */
    .controls-overlay {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Recording Active State */
    .action-btn.recording {
      background: rgba(220, 38, 38, 0.9);
      border-color: #fca5a5;
      animation: pulse 1s infinite alternate;
    }

    /* Bottom Floating HUD Overlay */
    .overlay-bottom {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }

    .hud-item strong {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Element -->
  <video id="localVideo" autoplay playsinline muted></video>

  <!-- Top Dual Status Badge Overlay -->
  <div class="overlay-top">
    <div id="aiBadge" class="status-badge ai-clear">AI Active - Clear</div>
    <div id="sigBadge" class="status-badge sig-offline">SIG: Connecting</div>
  </div>

  <!-- Right Floating Controls -->
  <div class="controls-overlay">
    <!-- Photo Snap Button -->
    <button id="snapBtn" class="action-btn" title="Take Photo">
      <svg viewBox="0 0 24 24">
        <path d="M12 15.25a3.25 3.25 0 100-6.5 3.25 3.25 0 000 6.5z"/>
        <path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
      </svg>
    </button>

    <!-- Video Record Button -->
    <button id="recordBtn" class="action-btn" title="Record Video">
      <svg viewBox="0 0 24 24">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Details Overlay -->
  <div class="overlay-bottom">
    <div class="hud-item">AI: <strong>connectgold-gateway</strong></div>
    <div class="hud-item">SIGNAL: <strong>signal.chyke.online</strong></div>
  </div>

  <script>
    const WORKER_GATEWAY_URL = 'https://orange-field-e94b.trustconnect713.workers.dev/';
    const SIGNALING_URL = 'wss://signal.chyke.online';

    const videoElement = document.getElementById('localVideo');
    const aiBadge = document.getElementById('aiBadge');
    const sigBadge = document.getElementById('sigBadge');
    const snapBtn = document.getElementById('snapBtn');
    const recordBtn = document.getElementById('recordBtn');

    let localStream = null;
    let ws = null;
    let peerConnection = null;
    let aiInterval = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    const iceConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    // Filter out low-confidence detections and indoor false positives
    function getFilteredCategories(objects) {
      const MIN_CONFIDENCE = 0.65;
      const categories = new Set();

      objects.forEach(obj => {
        const score = obj.score;
        const l = obj.label.toLowerCase();

        // 1. Human Detection
        if (l === 'person' && score >= MIN_CONFIDENCE) {
          categories.add('HUMAN');
        } 
        // 2. Vehicle Detection (Requires 85%+ to prevent indoor furniture false positives)
        else if (['car', 'truck', 'bus', 'motorcycle', 'bicycle', 'airplane', 'train', 'boat'].includes(l) && score >= 0.85) {
          categories.add('VEHICLE');
        } 
        // 3. Animal Detection
        else if (['cat', 'dog', 'bird', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe'].includes(l) && score >= MIN_CONFIDENCE) {
          categories.add('ANIMAL');
        } 
        // 4. Bags / Luggage
        else if (['backpack', 'handbag', 'suitcase'].includes(l) && score >= MIN_CONFIDENCE) {
          categories.add('BAG / ACCESSORY');
        } 
        // 5. Indoor / Household Objects
        else if (score >= 0.70 && !['car', 'truck', 'bus', 'motorcycle'].includes(l)) {
          categories.add('OBJECT');
        }
      });

      return Array.from(categories);
    }

    // 1. Initialize Camera Stream
    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      } catch (err) {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      }
      videoElement.srcObject = localStream;
    }

    // 2. Connect to WebSockets Signaling Server
    function connectSignaling() {
      if (ws) ws.close();

      ws = new WebSocket(SIGNALING_URL);

      ws.onopen = () => {
        sigBadge.innerText = 'SIG: Online';
        sigBadge.className = 'status-badge sig-online';
        ws.send(JSON.stringify({ type: 'register_camera' }));
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'offer') {
          peerConnection = new RTCPeerConnection(iceConfig);

          if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
          }

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) {
              ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
            }
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          ws.send(JSON.stringify({ type: 'answer', answer: answer }));
        } else if (data.type === 'ice-candidate' && peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };

      ws.onclose = () => {
        sigBadge.innerText = 'SIG: Reconnecting';
        sigBadge.className = 'status-badge sig-offline';
      };

      ws.onerror = () => ws.close();
    }

    // 3. Capture Frame and Send to Cloudflare AI Gateway
    async function sendFrameToCloudflareAI() {
      if (!videoElement || videoElement.readyState !== 4) return;

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        try {
          const response = await fetch(WORKER_GATEWAY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg' },
            body: blob
          });

          const result = await response.json();

          if (result.alert && result.objects && result.objects.length > 0) {
            const categories = getFilteredCategories(result.objects);

            if (categories.length > 0) {
              aiBadge.innerText = `⚠️ TARGET DETECTED: ${categories.join(' + ')}`;
              aiBadge.className = 'status-badge ai-alert';

              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ 
                  type: 'ai_alert', 
                  count: categories.length, 
                  categories: categories, 
                  objects: result.objects 
                }));
              }
            } else {
              aiBadge.innerText = 'AI Active - Clear';
              aiBadge.className = 'status-badge ai-clear';
            }
          } else {
            aiBadge.innerText = 'AI Active - Clear';
            aiBadge.className = 'status-badge ai-clear';
          }
        } catch (err) {
          console.error('Cloudflare AI Inference Error:', err);
        }
      }, 'image/jpeg', 0.8);
    }

    // 4. Photo Snap Feature
    snapBtn.addEventListener('click', () => {
      if (!videoElement || videoElement.readyState !== 4) return;

      const canvas = document.createElement('canvas');
      canvas.width = videoElement.videoWidth || 1280;
      canvas.height = videoElement.videoHeight || 720;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      const imageURL = canvas.toDataURL('image/jpeg', 0.95);
      const downloadLink = document.createElement('a');
      downloadLink.href = imageURL;
      downloadLink.download = `cctv_snap_${Date.now()}.jpg`;
      downloadLink.click();
    });

    // 5. Video Record Feature
    recordBtn.addEventListener('click', () => {
      if (!localStream) return;

      if (!isRecording) {
        recordedChunks = [];
        const options = { mimeType: 'video/webm;codecs=vp9,opus' };
        
        try {
          mediaRecorder = new MediaRecorder(localStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(localStream);
        }

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoURL = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = videoURL;
          downloadLink.download = `cctv_record_${Date.now()}.webm`;
          downloadLink.click();
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
      }
    });

    // Interval & Visibility Lifecycle Controllers
    function startAILoop() {
      if (aiInterval) clearInterval(aiInterval);
      aiInterval = setInterval(sendFrameToCloudflareAI, 3000);
    }

    function stopAILoop() {
      if (aiInterval) {
        clearInterval(aiInterval);
        aiInterval = null;
      }
    }

    async function handleResume() {
      stopAILoop();
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      await startCamera();
      connectSignaling();
      startAILoop();
    }

    function handleMinimize() {
      stopAILoop();
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) handleMinimize();
      else handleResume();
    });

    // Application Entry Point
    async function init() {
      await startCamera();
      connectSignaling();
      startAILoop();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
