<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar CCTV Gateway</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #064e3b;
      color: #34d399;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34d399;
      border-radius: 50%;
    }

    /* Your Exact Player Wrapper */
    .video-container {
      position: relative;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Barcode/Pairing Controls */
    .controls {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Solar CCTV Live Terminal</h1>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="solar-status">Solar Power: Active</span>
      </div>
    </div>

    <!-- Embedded Cloudflare Stream Player -->
    <div class="video-container">
      <iframe
        id="cctv-player"
        src="https://customer-ig4in4evq0zptk7g.cloudflarestream.com/f1bad6ee6d73358363a26d71c36e514a/iframe"
        style="border: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%;"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen="true">
      </iframe>
    </div>

    <!-- Barcode / UID Input Bridge -->
    <div class="controls">
      <input 
        type="text" 
        id="camera-uid" 
        placeholder="Scan or enter Barcode/QR UID (e.g. CAM_8892)..." 
      />
      <button onclick="connectCamera()">Connect</button>
    </div>
  </div>

  <script>
    async function connectCamera() {
      const uid = document.getElementById('camera-uid').value.trim();
      if (!uid) {
        alert("Please enter or scan a CCTV barcode UID.");
        return;
      }

      try {
        // Send request to your live Cloudflare Worker edge gateway
        const response = await fetch(`https://odd-sunset-5c41.trustconnect713.workers.dev/api/connect?uid=${encodeURIComponent(uid)}`);
        const data = await response.json();

        if (data.success) {
          alert(`Connected to Camera: ${data.cameraId}\nStatus: ${data.solarStatus}`);
        } else {
          alert("Failed to pair with CCTV.");
        }
      } catch (err) {
        console.error("Error connecting to worker:", err);
        alert("Error establishing optical connection.");
      }
    }
  </script>

</body>
</html>
