<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember AS — Encrypted Bitcoin Core</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16;
            --panel-bg: rgba(21, 29, 46, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --ember-orange: #ff6b00;
            --ember-glow: rgba(255, 107, 0, 0.25);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --input-bg: #0d1322;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 620px; }
        .brand-header { text-align: center; margin-bottom: 28px; }
        .brand-title { font-size: 2rem; font-weight: 700; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .brand-title span.fire { color: var(--ember-orange); filter: drop-shadow(0 0 10px var(--ember-glow)); }
        .brand-subtitle { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
        
        .network-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 107, 0, 0.1); border: 1px solid rgba(255, 107, 0, 0.2);
            color: var(--ember-orange); padding: 4px 12px; border-radius: 20px;
            font-size: 0.725rem; font-weight: 700; margin-top: 10px;
        }

        .pulse-dot { width: 6px; height: 6px; background-color: var(--ember-orange); border-radius: 50%; box-shadow: 0 0 8px var(--ember-orange); }

        .panel {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border); border-radius: 16px;
            padding: 22px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }
        .panel-title { font-size: 1rem; font-weight: 600; margin: 0; color: var(--text-main); }
        .form-group { margin-bottom: 14px; }

        label { display: block; font-size: 0.775rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

        input, textarea {
            width: 100%; padding: 12px; background: var(--input-bg);
            border: 1px solid var(--panel-border); border-radius: 8px;
            color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; outline: none;
        }

        input:focus, textarea:focus { border-color: var(--ember-orange); box-shadow: 0 0 0 3px var(--ember-glow); }
        textarea { resize: vertical; height: 75px; }

        .btn {
            width: 100%; padding: 13px; background: var(--ember-orange); color: #000;
            font-weight: 700; font-size: 0.875rem; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 14px var(--ember-glow);
        }

        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-secondary { background: #2563eb; color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25); }
        .btn-success { background: var(--success); color: #000; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }

        .balance-card {
            background: var(--input-bg); border: 1px solid var(--panel-border);
            border-radius: 12px; padding: 16px; display: flex; align-items: center;
            justify-content: space-between; margin-top: 14px;
        }

        .balance-amount { font-size: 1.5rem; font-weight: 700; color: var(--success); font-family: 'JetBrains Mono', monospace; }
        .balance-sub { font-size: 0.825rem; color: var(--text-muted); font-weight: 500; }

        .console-output {
            background: var(--input-bg); border: 1px solid var(--panel-border);
            border-radius: 8px; padding: 12px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.775rem; color: var(--text-muted); max-height: 180px; overflow-y: auto;
            white-space: pre-wrap; word-break: break-all; margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand-header">
        <h1 class="brand-title"><span class="fire">🔥 EMBER</span> AS</h1>
        <div class="brand-subtitle">Encrypted Bitcoin Core Engine (Real On-Chain)</div>
        <div class="network-badge">
            <div class="pulse-dot"></div>
            BITCOIN CORE ACTIVE
        </div>
    </div>

    <!-- 1. WALLET CREATION -->
    <div class="panel">
        <div class="panel-header">
            <h2 class="panel-title">1. Generate & Encrypt Wallet</h2>
        </div>
        <div class="form-group">
            <label for="createPin">Master Encryption PIN (Min 4 Digits)</label>
            <input type="password" id="createPin" placeholder="Enter PIN to encrypt keys..." maxlength="8">
        </div>
        <button class="btn" onclick="createWallet()">Generate Secured Wallet</button>
        <div id="createOutput" class="console-output">Awaiting key derivation...</div>
    </div>

    <!-- 2. BALANCE QUERY -->
    <div class="panel">
        <div class="panel-header">
            <h2 class="panel-title">2. Address Inspector</h2>
        </div>
        <div class="form-group">
            <label for="checkAddress">Native SegWit Address (P2WPKH)</label>
            <input type="text" id="checkAddress" placeholder="bc1q... or tb1q...">
        </div>
        <button class="btn btn-secondary" onclick="checkBalance()">Sync On-Chain Balance</button>
        
        <div class="balance-card">
            <div>
                <div class="balance-sub">Confirmed Balance</div>
                <div class="balance-amount" id="satsVal">0 Sats</div>
            </div>
            <div style="text-align: right;">
                <div class="balance-sub">BTC Value</div>
                <div style="font-size: 1rem; font-weight: 600;" id="btcVal">0.00000000 BTC</div>
            </div>
        </div>
    </div>

    <!-- 3. TRANSACTION BROADCAST -->
    <div class="panel">
        <div class="panel-header">
            <h2 class="panel-title">3. PSBT Sign & Broadcast</h2>
        </div>
        <div class="form-group">
            <label for="sendWifPayload">Encrypted Payload Object</label>
            <textarea id="sendWifPayload" placeholder='{"ciphertext":"...","iv":"...","pubKeyHex":"...","address":"..."}'></textarea>
        </div>
        <div class="form-group">
            <label for="sendPin">Decryption PIN</label>
            <input type="password" id="sendPin" placeholder="Enter PIN to decrypt private key in memory">
        </div>
        <div class="form-group">
            <label for="recipientAddress">Recipient SegWit Address</label>
            <input type="text" id="recipientAddress" placeholder="bc1q... or tb1q...">
        </div>
        <div class="form-group">
            <label for="sendAmount">Amount (Satoshis)</label>
            <input type="number" id="sendAmount" placeholder="e.g. 1000">
        </div>
        <button class="btn btn-success" onclick="sendBitcoin()">Sign & Execute Transaction</button>
        <div id="sendOutput" class="console-output">Broadcast status will appear here...</div>
    </div>
</div>

<!-- REAL CLIENT-SIDE BITCOIN ENGINE USING @SCURE LIBRARIES -->
<script type="module">
    // Load Audited Bitcoin Modules from NPM via esm.sh CDN
    import { generateMnemonic, mnemonicToSeedSync } from 'https://esm.sh/@scure/bip39@1.3.0';
    import { wordlist } from 'https://esm.sh/@scure/bip39@1.3.0/wordlists/english';
    import { HDKey } from 'https://esm.sh/@scure/bip32@1.4.0';
    import * as btc from 'https://esm.sh/@scure/btc-signer@1.4.0';
    import { hex, base64 } from 'https://esm.sh/@scure/base@1.1.7';

    // 1. WEB CRYPTO API: AES-256-GCM Encryption
    async function deriveKeyFromPin(pin) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        const salt = enc.encode("ember_core_secure_salt_v1");
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function encryptData(text, pin) {
        const key = await deriveKeyFromPin(pin);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, key, enc.encode(text)
        );
        return {
            ciphertext: base64.encode(new Uint8Array(encrypted)),
            iv: base64.encode(iv)
        };
    }

    async function decryptData(encryptedObj, pin) {
        const key = await deriveKeyFromPin(pin);
        const iv = base64.decode(encryptedObj.iv);
        const ciphertext = base64.decode(encryptedObj.ciphertext);
        const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv }, key, ciphertext
        );
        const dec = new TextDecoder();
        return dec.decode(decrypted);
    }

    // 2. REAL WALLET GENERATION
    window.createWallet = async function() {
        const pin = document.getElementById('createPin').value;
        const out = document.getElementById('createOutput');
        if (!pin || pin.length < 4) {
            alert('Please specify a secure PIN with at least 4 digits.');
            return;
        }

        out.innerText = 'Deriving real keys locally...';

        try {
            // Generate Real 12-word Mnemonic & Seed
            const mnemonic = generateMnemonic(wordlist, 128); 
            const seed = mnemonicToSeedSync(mnemonic);
            
            // BIP84 Native SegWit Derivation
            const root = HDKey.fromMasterSeed(seed);
            const child = root.derive("m/84'/0'/0'/0/0");
            
            // Derive P2WPKH Mainnet Address
            const p2wpkh = btc.p2wpkh(child.publicKey, btc.NETWORK); 
            const address = p2wpkh.address;

            // Encrypt the Private Key (Hex) with AES
            const privKeyHex = hex.encode(child.privateKey);
            const pubKeyHex = hex.encode(child.publicKey);
            
            const encryptedKey = await encryptData(privKeyHex, pin);

            const payload = {
                success: true,
                address: address,
                pubKeyHex: pubKeyHex,
                encryptedData: {
                    wif: encryptedKey
                }
            };

            // Display results + Seed Phrase Backup
            out.innerText = JSON.stringify({ ...payload, mnemonic_backup: mnemonic }, null, 2);

            // Populate next steps automatically
            document.getElementById('checkAddress').value = payload.address;
            document.getElementById('sendWifPayload').value = JSON.stringify({
                ...payload.encryptedData.wif, 
                pubKeyHex: payload.pubKeyHex,
                address: payload.address 
            });
            document.getElementById('sendPin').value = pin;

        } catch (err) {
            out.innerText = 'Error generating keys: ' + err.message;
        }
    };

    // 3. REAL BALANCE API
    window.checkBalance = async function() {
        const address = document.getElementById('checkAddress').value.trim();
        if (!address) {
            alert('Please enter a valid address.');
            return;
        }

        try {
            const isTestnet = address.startsWith('tb1') || address.startsWith('m') || address.startsWith('n');
            const url = isTestnet 
                ? `https://blockstream.info/testnet/api/address/${address}` 
                : `https://blockstream.info/api/address/${address}`;

            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to query block explorer');
            
            const info = await res.json();
            const funded = info.chain_stats.funded_txo_sum || 0;
            const spent = info.chain_stats.spent_txo_sum || 0;
            const balanceSats = funded - spent;
            const balanceBtc = (balanceSats / 1e8).toFixed(8);

            document.getElementById('satsVal').innerText = `${balanceSats.toLocaleString()} Sats`;
            document.getElementById('btcVal').innerText = `${balanceBtc} BTC`;

        } catch (err) {
            alert('Balance fetch error: ' + err.message);
        }
    };

    // 4. REAL SIGNING & NETWORK BROADCAST
    window.sendBitcoin = async function() {
        const wifRaw = document.getElementById('sendWifPayload').value.trim();
        const pin = document.getElementById('sendPin').value;
        const recipient = document.getElementById('recipientAddress').value.trim();
        const amountSatsStr = document.getElementById('sendAmount').value;
        const out = document.getElementById('sendOutput');

        if (!wifRaw || !pin || !recipient || !amountSatsStr) {
            alert('Please complete all send parameters.');
            return;
        }

        out.innerText = 'Decrypting memory, fetching UTXOs, calculating fees, and signing TX...';

        let encryptedObj;
        try {
            encryptedObj = JSON.parse(wifRaw);
        } catch (e) {
            alert('Malformed Encrypted JSON.');
            return;
        }

        try {
            // Decrypt Private Key
            const privKeyHex = await decryptData(encryptedObj, pin);
            const privKey = hex.decode(privKeyHex);
            const pubKey = hex.decode(encryptedObj.pubKeyHex);
            const address = encryptedObj.address;
            
            const isTestnet = address.startsWith('tb1') || address.startsWith('m');
            const network = isTestnet ? btc.TEST_NETWORK : btc.NETWORK;

            // Fetch UTXOs from Blockstream
            const utxoUrl = isTestnet 
                ? `https://blockstream.info/testnet/api/address/${address}/utxo` 
                : `https://blockstream.info/api/address/${address}/utxo`;
                
            const utxoRes = await fetch(utxoUrl);
            if (!utxoRes.ok) throw new Error("Failed to fetch UTXOs. Network block maybe?");
            const utxos = await utxoRes.json();
            
            if (utxos.length === 0) throw new Error("No UTXOs found (Wallet is empty)");

            const p2wpkh = btc.p2wpkh(pubKey, network);
            const tx = new btc.Transaction();

            let totalInput = 0n;
            for (const utxo of utxos) {
                totalInput += BigInt(utxo.value);
                tx.addInput({
                    ...p2wpkh,
                    txid: utxo.txid,
                    index: utxo.vout,
                    witnessUtxo: { script: p2wpkh.script, amount: BigInt(utxo.value) }
                });
            }

            const sendAmount = BigInt(amountSatsStr);
            const fee = 300n; // Hardcoded basic fee buffer for now
            
            if (totalInput < sendAmount + fee) {
                throw new Error(`Insufficient balance. Have ${totalInput}, need ${sendAmount + fee}`);
            }

            // Add Output to Recipient
            tx.addOutputAddress(recipient, sendAmount, network);

            // Add Change Output back to Sender (if above dust limit)
            const change = totalInput - sendAmount - fee;
            if (change > 546n) { 
                tx.addOutputAddress(address, change, network);
            }

            // Sign and Finalize internally!
            tx.sign(privKey);
            tx.finalize();
            const txHex = tx.hex;

            out.innerText = `Raw TX Signed Successfully:\n${txHex.substring(0,60)}...\n\nBroadcasting to network...`;

            // Broadcast to real blockchain network
            const broadcastUrl = isTestnet 
                ? `https://blockstream.info/testnet/api/tx` 
                : `https://blockstream.info/api/tx`;
                
            const bRes = await fetch(broadcastUrl, {
                method: 'POST',
                body: txHex
            });
            
            if (bRes.ok) {
                const txid = await bRes.text();
                out.innerText = `SUCCESS! Transaction sent to network.\n\nTXID: ${txid}`;
            } else {
                const errText = await bRes.text();
                throw new Error(`Broadcast rejected by node: ${errText}`);
            }

        } catch (err) {
            out.innerText = 'Error: ' + err.message;
        }
    };
</script>

</body>
</html>
