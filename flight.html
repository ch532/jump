<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Search Widget</title>
  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .flight-search-container {
      max-width: 450px;
      margin: 0 auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .flight-search-container h3 {
      margin-top: 0;
      color: #1a73e8;
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .flight-search-group {
      margin-bottom: 15px;
    }
    .flight-search-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 14px;
      color: #3c4043;
    }
    .flight-search-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .flight-search-group input:focus {
      border-color: #1a73e8;
      outline: none;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    .flight-row {
      display: flex;
      gap: 10px;
    }
    .flight-row .flight-search-group {
      flex: 1;
    }
    .flight-search-btn {
      width: 100%;
      padding: 12px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .flight-search-btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

  <div class="flight-search-container">
    <h3>Search Flights</h3>
    <form id="flightSearchForm">
      <div class="flight-row">
        <div class="flight-search-group">
          <label for="origin">From (Code)</label>
          <input type="text" id="origin" placeholder="e.g. LOS" required>
        </div>
        <div class="flight-search-group">
          <label for="destination">To (Code)</label>
          <input type="text" id="destination" placeholder="e.g. LHR" required>
        </div>
      </div>

      <div class="flight-row">
        <div class="flight-search-group">
          <label for="outboundDate">Departure</label>
          <input type="date" id="outboundDate" required>
        </div>
        <div class="flight-search-group">
          <label for="returnDate">Return (Opt.)</label>
          <input type="date" id="returnDate">
        </div>
      </div>

      <button type="submit" class="flight-search-btn">Search Google Flights</button>
    </form>
  </div>

  <script>
    document.getElementById('flightSearchForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const origin = document.getElementById('origin').value.trim().toUpperCase();
      const destination = document.getElementById('destination').value.trim().toUpperCase();
      const outbound = document.getElementById('outboundDate').value;
      const returnDate = document.getElementById('returnDate').value;

      let queryString = `Flights to ${destination} from ${origin} on ${outbound}`;
      
      if (returnDate) {
        queryString += ` through ${returnDate}`;
      }

      const targetUrl = `https://www.google.com/travel/flights?q=${encodeURIComponent(queryString)}`;
      window.open(targetUrl, '_blank');
    });
  </script>

</body>
</html>
