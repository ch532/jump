<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldtech by Okoye Chibuike</title>
  
  <link rel="icon" type="image/png" href="https://www.chyke.online/connectgold_2.png">
  <link rel="apple-touch-icon" href="https://www.chyke.online/connectgold_2.png">

  <meta name="description" content="Goldtech by Okoye Chibuike - AI platform featuring Chat, Moderation, OCR, and Image Generation.">
  <meta name="author" content="Okoye Chibuike">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .brand-logo { width: 48px; height: 48px; border-radius: 8px; }
    h1 { margin: 0; color: var(--accent); font-size: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    textarea, input[type="file"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea { height: 80px; resize: vertical; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button.voice-btn { background: #10b981; }
    button.voice-btn.recording { background: #ef4444; }
    .output {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 4px;
      min-height: 40px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output img { max-width: 100%; border-radius: 4px; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <div class="header-container">
    <img src="https://www.chyke.online/connectgold_2.png" alt="Goldtech Logo" class="brand-logo" />
    <h1>Goldtech by Okoye Chibuike</h1>
  </div>

  <div class="grid">
    <!-- 1. CHAT -->
    <div class="card">
      <h3>💬 Chat / Generation</h3>
      <textarea id="chatInput" placeholder="Type prompt or use voice button..."></textarea>
      <div class="controls">
        <button onclick="sendChat()">Send Prompt</button>
        <button class="voice-btn" id="chatVoiceBtn" onclick="toggleVoiceInput('chatInput', 'chatVoiceBtn')">🎤 Speak Prompt</button>
      </div>
      <div class="output" id="chatOutput"></div>
    </div>

    <!-- 2. CONTENT MODERATION -->
    <div class="card">
      <h3>🛡️ Content Moderation</h3>
      <textarea id="modInput" placeholder="Type text or upload file to moderate..."></textarea>
      <input type="file" id="modFile" accept=".txt,.json,.md,.js,.html" onchange="loadFileContent(event, 'modInput')" />
      <div class="controls">
        <button onclick="sendModeration()">Moderate Text</button>
        <button class="voice-btn" id="modVoiceBtn" onclick="toggleVoiceInput('modInput', 'modVoiceBtn')">🎤 Speak Text</button>
      </div>
      <div class="output" id="modOutput"></div>
    </div>

    <!-- 3. OCR (IMAGE TO TEXT) -->
    <div class="card">
      <h3>📷 Optical Character Recognition (OCR)</h3>
      <input type="file" id="ocrFile" accept="image/*" />
      <div class="controls">
        <button onclick="sendOCR()">Extract Text from Image</button>
      </div>
      <div class="output" id="ocrOutput"></div>
    </div>

    <!-- 4. IMAGE GENERATION -->
    <div class="card">
      <h3>🎨 Visual AI Generator</h3>
      <textarea id="imageInput" placeholder="Describe the image you want to generate..."></textarea>
      <div class="controls">
        <button onclick="sendImageGen()">Generate Image</button>
        <button class="voice-btn" id="imageVoiceBtn" onclick="toggleVoiceInput('imageInput', 'imageVoiceBtn')">🎤 Speak Description</button>
      </div>
      <div class="output" id="imageOutput"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://summer-bonus-db30.trustconnect713.workers.dev";

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = (error) => reject(error);
    });

    function loadFileContent(event, targetId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => { document.getElementById(targetId).value = e.target.result; };
      reader.readAsText(file);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      }
    }

    let recognition;
    let activeBtnId = null;

    function toggleVoiceInput(inputId, btnId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Web Speech Recognition is not supported.");

      const btn = document.getElementById(btnId);
      if (recognition && activeBtnId === btnId) { recognition.stop(); return; }
      if (recognition) recognition.stop();

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        activeBtnId = btnId;
        btn.classList.add('recording');
        btn.textContent = "🛑 Listening...";
      };

      recognition.onresult = (e) => {
        document.getElementById(inputId).value = e.results[0][0].transcript;
      };

      recognition.onend = () => {
        btn.classList.remove('recording');
        btn.textContent = "🎤 Speak Input";
        activeBtnId = null;
      };

      recognition.start();
    }

    async function sendChat() {
      const prompt = document.getElementById('chatInput').value;
      const output = document.getElementById('chatOutput');
      if (!prompt) return alert("Please enter a prompt.");
      output.textContent = "Generating...";
      try {
        const res = await fetch(`${WORKER_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        const text = data.response || data.error;
        output.textContent = text;
        speakText(text);
      } catch (err) { output.textContent = "Error: " + err.message; }
    }

    async function sendModeration() {
      const text = document.getElementById('modInput').value;
      const output = document.getElementById('modOutput');
      if (!text) return alert("Please enter text.");
      output.textContent = "Evaluating...";
      try {
        const res = await fetch(`${WORKER_URL}/moderation`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        output.textContent = typeof data.result === 'object' ? JSON.stringify(data.result, null, 2) : data.result;
        speakText(output.textContent);
      } catch (err) { output.textContent = "Error: " + err.message; }
    }

    async function sendOCR() {
      const file = document.getElementById('ocrFile').files[0];
      const output = document.getElementById('ocrOutput');
      if (!file) return alert("Select an image file.");
      output.textContent = "Extracting text...";
      try {
        const imageBase64 = await fileToBase64(file);
        const res = await fetch(`${WORKER_URL}/ocr`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64 })
        });
        const data = await res.json();
        output.textContent = data.text || data.error;
        speakText(output.textContent);
      } catch (err) { output.textContent = "Error: " + err.message; }
    }

    async function sendImageGen() {
      const prompt = document.getElementById('imageInput').value;
      const output = document.getElementById('imageOutput');
      if (!prompt) return alert("Please enter a visual description.");
      output.textContent = "Rendering image...";
      try {
        const res = await fetch(`${WORKER_URL}/generate-image`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        if (data.imageBase64) {
          output.innerHTML = `<img src="data:image/png;base64,${data.imageBase64}" alt="Generated Image" />`;
        } else {
          output.textContent = data.error || "Generation failed.";
        }
      } catch (err) { output.textContent = "Error: " + err.message; }
    }
  </script>
</body>
</html>
