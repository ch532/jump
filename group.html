<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connectgold Discussion</title>
  
  <!-- Oswald Font Link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .group-card {
      max-width: 450px;
      width: 100%;
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }
    .app-branding img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .oswald-title {
      font-family: "Oswald", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: normal;
      font-size: 26px;
      color: #1a73e8;
      margin: 5px 0 12px 0;
      text-transform: uppercase;
    }
    .group-card p {
      color: #5f6368;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .group-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background-color: #1a73e8;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      box-sizing: border-box;
      transition: background-color 0.2s;
    }
    .group-btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

  <div class="group-card">
    <!-- App Branding & Logo -->
    <div class="app-branding">
      <img src="https://www.chyke.online/connectgold_2.png" alt="App Logo">
    </div>
    
    <h2 class="oswald-title">Firebase Talk Community</h2>
    <p>Join the official Google Group discussion forum for Firebase developers to ask questions, share insights, and stay updated.</p>
    
    <!-- Action Link Button -->
    <a href="https://groups.google.com/g/firebase-talk" class="group-btn" target="_blank" rel="noopener noreferrer">
      Open Google Group
    </a>
  </div>

</body>
</html>
