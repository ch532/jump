<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HLS Camera Stream Terminal</title>
  <!-- HLS.js Library for non-Safari browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .video-container {
      width: 100%;
      max-width: 640px;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <h3>HLS Stream Feed</h3>

  <div class="video-container">
    <video id="hlsVideo" controls autoplay muted playsinline></video>
  </div>

  <div id="status" class="status">Connecting to stream...</div>

  <script>
    const video = document.getElementById('hlsVideo');
    const statusDiv = document.getElementById('status');
    
    // Replace with your actual HLS .m3u8 stream URL
    const streamUrl = 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8
';

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true, // Optimizes for real-time live playback
      });
      
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        statusDiv.innerText = 'Stream connected. Playing...';
        video.play().catch(() => {
          statusDiv.innerText = 'Click video to un-mute and play.';
        });
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          statusDiv.innerText = 'Connection error: ' + data.details;
        }
      });
    } 
    // Native support check (for Safari / iOS)
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function () {
        video.play();
        statusDiv.innerText = 'Stream connected (Native HLS).';
      });
    } else {
      statusDiv.innerText = 'HLS is not supported on this browser.';
    }
  </script>
</body>
</html>
