<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectgold Enterprise Retail OS</title>
    
    <!-- Open Graph Meta Tags for Portal Preview -->
    <meta property="og:title" content="Connectgold Enterprise Retail OS">
    <meta property="og:description" content="Cloud-native, AI-powered retail platform running on Google Cloud Run with Gemini AI, Maps Platform, and Workspace.">
    <meta property="og:image" content="https://chyke.online/connectgold_2.png">
    <meta property="og:url" content="https://chyke.online">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 640px;
            width: 90%;
            border: 1px solid #e8eaed;
        }
        .card img {
            width: 100%;
            max-width: 180px;
            height: auto;
            border-radius: 12px;
        }
        h1 {
            font-size: 24px;
            color: #202124;
            margin: 20px 0 10px;
        }
        p {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #000;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            background: #4285F4;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #3367d6;
        }
        .btn-secondary {
            background: #f1f3f4;
            color: #3c4043;
        }
        .btn-secondary:hover {
            background: #e8eaed;
        }
    </style>
</head>
<body>

    <main class="card">
        <img src="https://chyke.online/connectgold_2.png" alt="Connectgold Logo" width="500" height="500">
        <h1>Connectgold Enterprise Retail OS</h1>
        <p>A cloud-native, AI-powered retail platform built in Abuja, powering stores nationwide on Google Cloud Run with Gemini AI, Google Maps Platform, and Workspace.</p>
        
        <div>
            <span class="badge">GOOGLE CLOUD PARTNER ADVANTAGE</span>
        </div>

        <div class="btn-group">
            <a href="https://chyke.online" class="btn" target="_blank" rel="noopener noreferrer">Visit Platform</a>
            <a href="https://cloud.google.com/find-a-partner/" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Partner Finder</a>
        </div>
    </main>

</body>
</html>
