<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolAI-1 Spatial Terminal</title>

  <!-- Leaflet Core CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* MAP CONTAINER - Pin to absolute viewport edges to kill blank grey spaces */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* TOP ACTION BAR - Force fixed floating position at top */
    .top-action-bar {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 99999; /* Higher than leaflet layer controls */
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1.5px solid #ffd700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      -webkit-overflow-scrolling: touch;
    }

    .top-action-bar::-webkit-scrollbar { display: none; }
    .top-action-bar { -ms-overflow-style: none; scrollbar-width: none; }

    .action-btn {
      background: #1e293b;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.6);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .action-btn:active { background: #d97706; color: #fff; }

    /* REALTIME HUD */
    .spatial-hud {
      position: fixed;
      top: 68px;
      left: 10px;
      z-index: 99999;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #ffd700;
      font-family: monospace;
      pointer-events: none;
    }

    /* AI PANEL - Bottom-Left Anchored */
    .ai-chat-panel {
      position: fixed;
      bottom: 12px;
      left: 10px;
      width: calc(100vw - 20px);
      max-width: 440px;
      max-height: 420px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      border-radius: 16px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
    }

    .panel-header {
      background: rgba(30, 41, 59, 0.95);
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.85rem;
      color: #ffd700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-box {
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .msg { padding: 10px 14px; border-radius: 12px; max-width: 90%; line-height: 1.45; white-space: pre-wrap; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg.ai { background: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid rgba(255, 215, 0, 0.25); }
    .msg.system { background: rgba(217, 119, 6, 0.2); color: #fef3c7; border: 1px solid rgba(253, 224, 71, 0.4); align-self: center; font-size: 0.76rem; text-align: center; }

    .chat-controls {
      display: flex;
      padding: 10px;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
    }

    .icon-action-btn {
      background: #334155;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .chat-controls input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .send-btn {
      padding: 10px 16px;
      background: #d97706;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- FIXED TOP ACTION BAR -->
  <div class="top-action-bar">
    <button class="action-btn" onclick="zoomToLocalFeatures()">🎯 Zoom Features</button>
    <button class="action-btn" onclick="simulateNavigationRoute()">🛣️ Route Navigation</button>
    <button class="action-btn" onclick="locateUserGPS()">📍 Locate GPS</button>
  </div>

  <!-- REALTIME HUD -->
  <div class="spatial-hud" id="spatialHud">LAT: 20.0000 | LNG: 0.0000 | ZOOM: 2</div>

  <!-- FULLSCREEN MAP CANVAS -->
  <div id="map"></div>

  <!-- AI PANEL -->
  <div class="ai-chat-panel">
    <div class="panel-header">
      <span>🤖 SolAI-1 Spatial Terminal</span>
      <button onclick="toggleVoiceSpeaker()" id="speakerToggleBtn" style="background:none; border:none; color:#ffd700; font-weight:bold; cursor:pointer;">🔊 Voice: ON</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Terminal Ready. Use the top menu or type/speak spatial queries!</div>
    </div>
    <div class="chat-controls">
      <label class="icon-action-btn" title="Upload GeoJSON">
        📁
        <input type="file" id="fileInput" accept=".json,.geojson" style="display: none;" onchange="handleFileUpload(event)" />
      </label>
      <button class="icon-action-btn" id="micBtn" onclick="startVoiceRecognition()">🎙️</button>
      <input type="text" id="userInput" placeholder="Ask AI about map..." onkeydown="if(event.key==='Enter') sendSpatialQuery()" />
      <button class="send-btn" onclick="sendSpatialQuery()">Ask</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://restless-lab-5821.trustconnect713.workers.dev/';
    const userLocale = navigator.language || 'en-US';

    // 1. Initialize Leaflet Map
    const map = L.map('map', {
      center: [20.0, 0.0],
      zoom: 2,
      zoomControl: false
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Force Map Canvas to re-fill container bounds on load & window resize
    function resizeMap() {
      map.invalidateSize();
    }
    window.addEventListener('resize', resizeMap);
    window.addEventListener('orientationchange', resizeMap);
    setTimeout(resizeMap, 300);

    // Default Features
    const mapGeoData = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "id": "SUB_01", "name": "Central Power Substation", "type": "Utility" }, "geometry": { "type": "Point", "coordinates": [7.3986, 9.0765] } },
        { "type": "Feature", "properties": { "id": "SOLAR_NODE", "name": "SolAI-1 Array Station", "type": "Solar Telemetry" }, "geometry": { "type": "Point", "coordinates": [7.4100, 9.0850] } }
      ]
    };

    const geoJsonLayer = L.geoJSON(mapGeoData).addTo(map);

    function zoomToLocalFeatures() {
      map.flyToBounds(geoJsonLayer.getBounds(), { duration: 2.0, maxZoom: 14 });
      addChatMessage('system', '🌍 Zoomed to local infrastructure.');
    }

    function locateUserGPS() {
      if (!navigator.geolocation) return alert("GPS unavailable");
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        map.flyTo([lat, lng], 15, { duration: 2.0 });
        L.marker([lat, lng]).addTo(map).bindPopup("📍 GPS Position").openPopup();
        addChatMessage('system', `📍 GPS Centered: (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
      });
    }

    let activeRoutePolyline = null;
    function simulateNavigationRoute() {
      if (activeRoutePolyline) map.removeLayer(activeRoutePolyline);
      activeRoutePolyline = L.polyline([[9.0765, 7.3986], [9.0800, 7.4020], [9.0850, 7.4100]], { color: '#2563eb', weight: 5 }).addTo(map);
      map.flyToBounds(activeRoutePolyline.getBounds(), { duration: 2.0, padding: [40, 40] });
      addChatMessage('system', '🛣️ Route calculated.');
      sendSpatialQuery("Analyze active navigation route.");
    }

    map.on('mousemove touchmove', (e) => {
      document.getElementById('spatialHud').innerText = `LAT: ${e.latlng.lat.toFixed(4)} | LNG: ${e.latlng.lng.toFixed(4)} | ZOOM: ${map.getZoom()}`;
    });

    function addChatMessage(sender, text) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    async function sendSpatialQuery(overridePrompt = null) {
      const input = document.getElementById('userInput');
      const text = overridePrompt || input.value.trim();
      if (!text) return;

      addChatMessage('user', text);
      if (!overridePrompt) input.value = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text,
            context: {
              userLocale: userLocale,
              viewCenter: map.getCenter(),
              zoomLevel: map.getZoom()
            }
          })
        });

        const data = await res.json();
        if (data.answer) addChatMessage('ai', data.answer);
      } catch (err) {
        addChatMessage('ai', '⚠️ Error contacting Cloudflare AI worker.');
      }
    }
  </script>
</body>
</html>
