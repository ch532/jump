<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolAI-1 Geospatial GIS & Multilingual AI Navigation Terminal</title>

  <!-- Leaflet Core CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw Plugin -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Leaflet Heatmap Plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Turf.js for Spatial Analysis -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background-color: #000; }

    #map { width: 100vw; height: 100vh; z-index: 1; }

    /* Fixed & Horizontally Scrollable Top Menu Bar */
    .top-action-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: row;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .top-action-bar::-webkit-scrollbar { display: none; }
    .top-action-bar { -ms-overflow-style: none; scrollbar-width: none; }

    .action-btn {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      color: #ffd700;
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      padding: 10px 16px;
      border-radius: 22px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.active { background: #d97706; color: #fff; border-color: #fde047; }

    /* Floating HUD */
    .spatial-hud {
      position: absolute;
      top: 65px;
      left: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.72rem;
      color: #ffd700;
      font-family: monospace;
      pointer-events: none;
    }

    /* AI Assistant Panel */
    .ai-chat-panel {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 10px;
      max-width: 420px;
      margin: 0 auto;
      max-height: 480px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 215, 0, 0.5);
      border-radius: 18px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      color: #f8fafc;
      overflow: hidden;
    }

    .panel-header {
      background: rgba(30, 41, 59, 0.9);
      padding: 12px 16px;
      font-weight: 800;
      font-size: 0.88rem;
      color: #ffd700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .speaker-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
    }

    .chat-box {
      padding: 12px;
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .msg { padding: 10px 14px; border-radius: 12px; max-width: 90%; line-height: 1.45; white-space: pre-wrap; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg.ai { background: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid rgba(255, 215, 0, 0.25); }
    .msg.system { background: rgba(217, 119, 6, 0.2); color: #fef3c7; border: 1px solid rgba(253, 224, 71, 0.4); align-self: center; font-size: 0.76rem; text-align: center; }

    .chat-controls {
      display: flex;
      padding: 10px;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
    }

    .icon-action-btn {
      background: #334155;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-action-btn.recording {
      background: #dc2626;
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .chat-controls input[type="text"] {
      flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; font-size: 0.85rem;
    }

    .chat-controls button.send-btn {
      padding: 10px 14px; background: #d97706; border: none; border-radius: 10px; color: #fff; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Scrollable Action Menu -->
  <div class="top-action-bar">
    <button class="action-btn" onclick="zoomToLocalFeatures()">🎯 Zoom To Features</button>
    <button class="action-btn" onclick="simulateNavigationRoute()">🛣️ Route Navigation</button>
    <button class="action-btn" onclick="createBufferZone()">⭕ 1km Buffer Zone</button>
    <button class="action-btn" id="heatBtn" onclick="toggleHeatmap()">🔥 Heatmap Density</button>
    <button class="action-btn" onclick="locateUserGPS()">📍 Locate Device GPS</button>
  </div>

  <!-- Realtime HUD -->
  <div class="spatial-hud" id="spatialHud">LAT: 20.0000 | LNG: 0.0000 | ZOOM: 2</div>

  <!-- Leaflet Canvas -->
  <div id="map"></div>

  <!-- AI Panel -->
  <div class="ai-chat-panel">
    <div class="panel-header">
      <span>🤖 SolAI-1 Spatial Assistant</span>
      <button class="speaker-toggle-btn" id="speakerToggleBtn" onclick="toggleVoiceSpeaker()">🔊 Voice: ON</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">World Map Loaded. Speak using the 🎙️ microphone button or type your message to begin!</div>
    </div>
    <div class="chat-controls">
      <!-- File Upload Button -->
      <label class="icon-action-btn" title="Upload GeoJSON or Spatial File">
        📁
        <input type="file" id="fileInput" accept=".json,.geojson" style="display: none;" onchange="handleFileUpload(event)" />
      </label>

      <!-- Microphone Voice Input Button -->
      <button class="icon-action-btn" id="micBtn" onclick="startVoiceRecognition()" title="Speak to AI">🎙️</button>

      <input type="text" id="userInput" placeholder="Type or speak prompt..." onkeydown="if(event.key==='Enter') sendSpatialQuery()" />
      <button class="send-btn" onclick="sendSpatialQuery()">Ask</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://restless-lab-5821.trustconnect713.workers.dev/';

    const userLocale = navigator.language || 'en-US';
    let isSpeakerEnabled = true;
    const synth = window.speechSynthesis;

    // Speech Recognition Setup (Speech-To-Text)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = userLocale;

      recognition.onstart = function () {
        document.getElementById('micBtn').classList.add('recording');
        addChatMessage('system', '🎙️ Listening to your voice...');
      };

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        document.getElementById('micBtn').classList.remove('recording');
        sendSpatialQuery(); // Automatically send spoken prompt
      };

      recognition.onerror = function (event) {
        document.getElementById('micBtn').classList.remove('recording');
        addChatMessage('system', '⚠️ Voice input error or permission denied.');
      };

      recognition.onend = function () {
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function startVoiceRecognition() {
      if (!recognition) {
        alert("Speech Recognition is not supported by your browser.");
        return;
      }
      recognition.start();
    }

    function toggleVoiceSpeaker() {
      isSpeakerEnabled = !isSpeakerEnabled;
      const btn = document.getElementById('speakerToggleBtn');
      if (isSpeakerEnabled) {
        btn.innerText = '🔊 Voice: ON';
        btn.style.opacity = '1.0';
      } else {
        btn.innerText = '🔇 Voice: OFF';
        btn.style.opacity = '0.5';
        synth.cancel();
      }
    }

    function speakText(text) {
      if (!isSpeakerEnabled || !('speechSynthesis' in window)) return;
      synth.cancel();
      const plainText = text.replace(/[*#\-_`]/g, '');
      const utterance = new SpeechSynthesisUtterance(plainText);
      utterance.lang = userLocale;
      synth.speak(utterance);
    }

    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });

    const map = L.map('map', { center: [20.0, 0.0], zoom: 2, layers: [osmLayer] });
    L.control.layers({ "OpenStreetMap": osmLayer, "Satellite Imagery": satLayer }).addTo(map);

    let activeRouteData = null;
    let selectedMapFeature = null;
    let routePolyline = null;
    let bufferLayer = null;
    let heatLayer = null;
    let userDrawnGeometries = [];
    let uploadedFileContext = null;

    const mapGeoData = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "id": "SUB_01", "name": "Central Power Substation", "type": "Utility", "status": "Operational", "voltage": "33kV" }, "geometry": { "type": "Point", "coordinates": [7.3986, 9.0765] } },
        { "type": "Feature", "properties": { "id": "SOLAR_NODE", "name": "SolAI-1 Array Station", "type": "Solar Telemetry Node", "status": "Active", "output": "120kW" }, "geometry": { "type": "Point", "coordinates": [7.4100, 9.0850] } }
      ]
    };

    const geoJsonLayer = L.geoJSON(mapGeoData, {
      onEachFeature: function (feature, layer) {
        layer.on('click', function () {
          selectedMapFeature = feature.properties;
          const popup = `<b>${feature.properties.name}</b><br/>Type: ${feature.properties.type}<br/><button onclick="sendSpatialQuery('Analyze feature ${feature.properties.name}')" style="margin-top:4px; padding:4px 8px; background:#d97706; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Analyze with AI</button>`;
          layer.bindPopup(popup).openPopup();
          addChatMessage('system', `📍 Highlighted: ${feature.properties.name}`);
        });
      }
    }).addTo(map);

    function zoomToLocalFeatures() {
      map.flyToBounds(geoJsonLayer.getBounds(), { duration: 2.5, maxZoom: 14 });
      addChatMessage('system', '🌍 Zooming in from World View to Local Infrastructure.');
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsedGeoJSON = JSON.parse(e.target.result);
          const uploadedLayer = L.geoJSON(parsedGeoJSON, {
            style: { color: '#22c55e', weight: 3, fillOpacity: 0.3 }
          }).addTo(map);

          map.flyToBounds(uploadedLayer.getBounds(), { duration: 2.0 });

          uploadedFileContext = { fileName: file.name, fileData: parsedGeoJSON };
          addChatMessage('system', `📁 File Uploaded: ${file.name}`);
          sendSpatialQuery(`Analyze uploaded spatial file: ${file.name}`);
        } catch (err) {
          alert("Invalid GeoJSON or JSON file format.");
        }
      };
      reader.readAsText(file);
    }

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
    const drawControl = new L.Control.Draw({ edit: { featureGroup: drawnItems }, draw: { polygon: true, polyline: true, rectangle: true, circle: true, marker: true } });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (e) {
      const layer = e.layer;
      drawnItems.addLayer(layer);
      const geojson = layer.toGeoJSON();

      if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
        geojson.properties.calculatedAreaKm2 = (turf.area(geojson) / 1000000).toFixed(3);
        addChatMessage('system', `📐 Drawn Polygon Area: ${geojson.properties.calculatedAreaKm2} km²`);
      } else if (e.layerType === 'polyline') {
        geojson.properties.calculatedLengthKm = turf.length(geojson, { units: 'kilometers' }).toFixed(2);
        addChatMessage('system', `📏 Drawn Path Length: ${geojson.properties.calculatedLengthKm} km`);
      }

      userDrawnGeometries.push(geojson);
      sendSpatialQuery("Analyze this newly drawn spatial shape.");
    });

    function createBufferZone() {
      zoomToLocalFeatures();
      if (bufferLayer) map.removeLayer(bufferLayer);
      const buffered = turf.buffer(turf.point([7.3986, 9.0765]), 1, { units: 'kilometers' });
      bufferLayer = L.geoJSON(buffered, { style: { color: '#d97706', fillColor: '#fde047', fillOpacity: 0.35, weight: 2 } }).addTo(map);
      addChatMessage('system', '⭕ 1km Buffer Zone generated.');
      sendSpatialQuery("What assets exist within this 1km buffer zone?");
    }

    function toggleHeatmap() {
      const btn = document.getElementById('heatBtn');
      if (heatLayer) {
        map.removeLayer(heatLayer);
        heatLayer = null;
        btn.classList.remove('active');
        addChatMessage('system', '🔥 Heatmap Layer Disabled.');
      } else {
        zoomToLocalFeatures();
        heatLayer = L.heatLayer([[9.0765, 7.3986, 0.9], [9.0800, 7.4020, 0.6], [9.0850, 7.4100, 1.0]], { radius: 25, blur: 15, maxZoom: 17 }).addTo(map);
        btn.classList.add('active');
        addChatMessage('system', '🔥 Heatmap Layer Activated.');
      }
    }

    map.on('mousemove', (e) => {
      document.getElementById('spatialHud').innerText = `LAT: ${e.latlng.lat.toFixed(4)} | LNG: ${e.latlng.lng.toFixed(4)} | ZOOM: ${map.getZoom()}`;
    });

    function simulateNavigationRoute() {
      if (routePolyline) map.removeLayer(routePolyline);
      routePolyline = L.polyline([[9.0765, 7.3986], [9.0800, 7.4020], [9.0850, 7.4100]], { color: '#2563eb', weight: 5 }).addTo(map);
      map.flyToBounds(routePolyline.getBounds(), { duration: 2.0, padding: [50, 50] });

      activeRouteData = {
        origin: "Central Substation (9.0765, 7.3986)",
        destination: "SolAI-1 Array Station (9.0850, 7.4100)",
        distanceKm: "3.2 km",
        estimatedTimeMin: "7 mins",
        navigationSteps: ["Head North towards Independence Avenue", "Turn right onto Solar Expressway", "Arrive at SolAI-1 Array Station"]
      };

      addChatMessage('system', '🛣️ Navigation Route calculated.');
      sendSpatialQuery("Analyze active route navigation, turns, and features.");
    }

    function locateUserGPS() {
      if (!navigator.geolocation) return alert("GPS unavailable");
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        map.flyTo([lat, lng], 15, { duration: 2.5 });
        L.marker([lat, lng]).addTo(map).bindPopup("📍 GPS Position").openPopup();
        addChatMessage('system', `📍 Located GPS: (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
      });
    }

    function addChatMessage(sender, text) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;

      if (sender === 'ai') {
        speakText(text);
      }
    }

    async function sendSpatialQuery(overridePrompt = null) {
      const input = document.getElementById('userInput');
      const text = overridePrompt || input.value.trim();
      if (!text) return;

      addChatMessage('user', text);
      if (!overridePrompt) input.value = '';

      const fullMapState = {
        userLocale: userLocale,
        viewCenter: map.getCenter(),
        zoomLevel: map.getZoom(),
        mapBounds: map.getBounds(),
        activeRoute: activeRouteData,
        selectedFeature: selectedMapFeature,
        allMapFeatures: mapGeoData.features.map(f => f.properties),
        userDrawnGeometries: userDrawnGeometries,
        uploadedFileContext: uploadedFileContext
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, context: fullMapState })
        });

        const data = await res.json();
        if (data.answer) addChatMessage('ai', data.answer);
        else if (data.error) addChatMessage('ai', `⚠️ Worker Error: ${data.error}`);
      } catch (err) {
        addChatMessage('ai', '⚠️ Failed to connect to Cloudflare AI Worker.');
      }
    }
  </script>
</body>
</html>
