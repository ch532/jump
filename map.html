<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolAI-1 Interactive GIS Terminal</title>

  <!-- Leaflet Core CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    /* MAP CONTAINER - Ensured gesture capture */
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: auto !important;
    }

    /* TOP SCROLLABLE MENU - Fixed Z-index & Horizontal Touch Swiping */
    .top-action-bar {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 9999; /* Higher than Leaflet controls */
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 6px 4px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .top-action-bar::-webkit-scrollbar { display: none; }
    .top-action-bar { -ms-overflow-style: none; scrollbar-width: none; }

    .action-btn {
      background: #1e293b;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.5);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:active { transform: scale(0.95); background: #d97706; color: #fff; }

    /* REALTIME HUD */
    .spatial-hud {
      position: fixed;
      top: 66px;
      left: 10px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #ffd700;
      font-family: monospace;
      pointer-events: none;
    }

    /* AI PANEL OVERLAY */
    .ai-chat-panel {
      position: fixed;
      bottom: 12px;
      left: 10px;
      right: 10px;
      max-width: 420px;
      margin: 0 auto;
      max-height: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 215, 0, 0.5);
      border-radius: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }

    .panel-header {
      background: rgba(30, 41, 59, 0.9);
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.82rem;
      color: #ffd700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-box {
      padding: 10px;
      height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.82rem;
    }

    .msg { padding: 8px 12px; border-radius: 10px; max-width: 90%; line-height: 1.4; white-space: pre-wrap; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg.ai { background: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid rgba(255, 215, 0, 0.25); }
    .msg.system { background: rgba(217, 119, 6, 0.2); color: #fef3c7; align-self: center; font-size: 0.74rem; text-align: center; }

    .chat-controls {
      display: flex;
      padding: 8px;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      align-items: center;
    }

    .icon-btn {
      background: #334155;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat-controls input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.82rem;
    }

    .send-btn {
      padding: 8px 14px;
      background: #d97706;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- FIXED TOP MENU TOOLBAR -->
  <div class="top-action-bar">
    <button class="action-btn" onclick="zoomToLocalFeatures()">🎯 Features</button>
    <button class="action-btn" onclick="simulateNavigationRoute()">🛣️ Route</button>
    <button class="action-btn" onclick="fetchRealtimeWeather()">🌦️ Weather</button>
    <button class="action-btn" onclick="fetchNearbyPOIs()">🏢 POIs</button>
    <button class="action-btn" onclick="locateUserGPS()">📍 GPS</button>
  </div>

  <!-- REALTIME HUD -->
  <div class="spatial-hud" id="spatialHud">LAT: 20.0000 | LNG: 0.0000 | ZOOM: 2</div>

  <!-- MAP CANVAS -->
  <div id="map"></div>

  <!-- AI PANEL -->
  <div class="ai-chat-panel">
    <div class="panel-header">
      <span>🤖 SolAI-1 Spatial Terminal</span>
      <button onclick="toggleVoiceSpeaker()" id="speakerBtn" style="background:none; border:none; color:#ffd700; cursor:pointer;">🔊 Voice: ON</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Map initialized. Swipe top bar for actions, or ask spatial queries!</div>
    </div>
    <div class="chat-controls">
      <label class="icon-btn" title="Upload GeoJSON">
        📁
        <input type="file" id="fileInput" accept=".json,.geojson" style="display: none;" onchange="handleFileUpload(event)" />
      </label>
      <button class="icon-btn" onclick="startVoiceRecognition()" title="Voice Prompt">🎙️</button>
      <input type="text" id="userInput" placeholder="Ask AI about map..." onkeydown="if(event.key==='Enter') sendSpatialQuery()" />
      <button class="send-btn" onclick="sendSpatialQuery()">Ask</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://restless-lab-5821.trustconnect713.workers.dev/';
    const userLocale = navigator.language || 'en-US';

    // 1. Initialize Map Instance
    const map = L.map('map', {
      center: [20.0, 0.0],
      zoom: 2,
      zoomControl: true,
      tap: true // Ensure touch gestures work on mobile browsers
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Force Leaflet to re-calculate container dimensions after render
    setTimeout(() => {
      map.invalidateSize();
    }, 400);

    // Feature Data
    const mapGeoData = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "id": "SUB_01", "name": "Central Power Substation", "type": "Utility" }, "geometry": { "type": "Point", "coordinates": [7.3986, 9.0765] } },
        { "type": "Feature", "properties": { "id": "SOLAR_NODE", "name": "SolAI-1 Array Station", "type": "Solar Telemetry" }, "geometry": { "type": "Point", "coordinates": [7.4100, 9.0850] } }
      ]
    };

    const geoJsonLayer = L.geoJSON(mapGeoData).addTo(map);

    function zoomToLocalFeatures() {
      map.flyToBounds(geoJsonLayer.getBounds(), { duration: 2.0, maxZoom: 14 });
      addChatMessage('system', '🌍 Zoomed to local features.');
    }

    function locateUserGPS() {
      if (!navigator.geolocation) return alert("GPS unavailable");
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        map.flyTo([lat, lng], 15, { duration: 2.0 });
        L.marker([lat, lng]).addTo(map).bindPopup("📍 GPS Position").openPopup();
        addChatMessage('system', `📍 Located GPS: (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
      });
    }

    map.on('mousemove touchmove', (e) => {
      document.getElementById('spatialHud').innerText = `LAT: ${e.latlng.lat.toFixed(4)} | LNG: ${e.latlng.lng.toFixed(4)} | ZOOM: ${map.getZoom()}`;
    });

    function addChatMessage(sender, text) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    async function sendSpatialQuery(overridePrompt = null) {
      const input = document.getElementById('userInput');
      const text = overridePrompt || input.value.trim();
      if (!text) return;

      addChatMessage('user', text);
      if (!overridePrompt) input.value = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text,
            context: {
              userLocale: userLocale,
              viewCenter: map.getCenter(),
              zoomLevel: map.getZoom()
            }
          })
        });
        const data = await res.json();
        if (data.answer) addChatMessage('ai', data.answer);
      } catch (err) {
        addChatMessage('ai', '⚠️ Error contacting Cloudflare AI worker.');
      }
    }
  </script>
</body>
</html>
