<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SolAI-1 Advanced GIS & AI Navigation Terminal</title>

  <!-- Leaflet Core CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js for Spatial Geoprocessing -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background-color: #000; }
    #map { width: 100vw; height: 100vh; z-index: 1; }

    /* Top Action Bar */
    .top-action-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .top-action-bar::-webkit-scrollbar { display: none; }

    .action-btn {
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); color: #ffd700;
      border: 1.5px solid rgba(255, 215, 0, 0.6); padding: 10px 14px; border-radius: 22px;
      font-size: 0.8rem; font-weight: 800; cursor: pointer; flex-shrink: 0;
    }

    /* Spatial HUD */
    .spatial-hud {
      position: absolute; top: 60px; left: 10px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4); padding: 6px 12px; border-radius: 12px;
      font-size: 0.72rem; color: #ffd700; font-family: monospace; pointer-events: none;
    }

    /* AI Assistant Panel */
    .ai-chat-panel {
      position: absolute; bottom: 15px; left: 10px; right: 10px;
      max-width: 420px; margin: 0 auto; max-height: 480px;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 215, 0, 0.5); border-radius: 18px; z-index: 1000;
      display: flex; flex-direction: column; color: #f8fafc; overflow: hidden;
    }

    .panel-header {
      background: rgba(30, 41, 59, 0.9); padding: 10px 14px; font-weight: 800;
      font-size: 0.85rem; color: #ffd700; display: flex; justify-content: space-between; align-items: center;
    }

    .chat-box { padding: 12px; height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
    .msg { padding: 8px 12px; border-radius: 10px; max-width: 90%; line-height: 1.4; white-space: pre-wrap; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg.ai { background: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid rgba(255, 215, 0, 0.25); }
    .msg.system { background: rgba(217, 119, 6, 0.2); color: #fef3c7; align-self: center; font-size: 0.74rem; text-align: center; }

    .chat-controls { display: flex; padding: 8px; gap: 6px; background: rgba(15, 23, 42, 0.8); align-items: center; }
    .icon-btn { background: #334155; color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .chat-controls input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .send-btn { padding: 8px 14px; background: #d97706; border: none; border-radius: 8px; color: #fff; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Menu Bar -->
  <div class="top-action-bar">
    <button class="action-btn" onclick="fetchRealtimeWeather()">🌦️ Live Weather</button>
    <button class="action-btn" onclick="fetchNearbyPOIs()">🏢 Fetch POIs</button>
    <button class="action-btn" onclick="calculateMultiModalRoutes('driving')">🚗 Driving Route</button>
    <button class="action-btn" onclick="calculateMultiModalRoutes('walking')">🚶 Walking Route</button>
    <button class="action-btn" onclick="openStreetView()">📷 Street View</button>
  </div>

  <!-- Realtime HUD -->
  <div class="spatial-hud" id="spatialHud">LAT: 9.0765 | LNG: 7.3986 | WEATHER: Loading...</div>

  <!-- Leaflet Map -->
  <div id="map"></div>

  <!-- AI Terminal Panel -->
  <div class="ai-chat-panel">
    <div class="panel-header">
      <span>🤖 SolAI-1 Spatial Assistant</span>
      <button onclick="toggleVoiceSpeaker()" id="speakerBtn" style="background:none; border:none; color:#ffd700; cursor:pointer;">🔊 Voice: ON</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Map initialized. I am tracking weather, POIs, multi-modal routing, and real-time spatial context!</div>
    </div>
    <div class="chat-controls">
      <button class="icon-btn" onclick="startVoiceRecognition()" title="Speak to AI">🎙️</button>
      <input type="text" id="userInput" placeholder="Ask about routes, weather, POIs..." onkeydown="if(event.key==='Enter') sendSpatialQuery()" />
      <button class="send-btn" onclick="sendSpatialQuery()">Ask</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://restless-lab-5821.trustconnect713.workers.dev/';
    const userLocale = navigator.language || 'en-US';

    // Map Setup
    const map = L.map('map').setView([9.0765, 7.3986], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

    // Dynamic Context Tracking Variables
    let currentLiveWeather = null;
    let nearbyPOIData = [];
    let multiModalRouteData = null;
    let activeRoutePolyline = null;

    // 1. Live Weather Integration (Open-Meteo API)
    async function fetchRealtimeWeather() {
      const center = map.getCenter();
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${center.lat}&longitude=${center.lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`;
        const res = await fetch(url);
        const data = await res.json();

        currentLiveWeather = {
          temperatureC: data.current.temperature_2m,
          humidityPct: data.current.relative_humidity_2m,
          windSpeedKmh: data.current.wind_speed_10m,
          weatherCode: data.current.weather_code
        };

        document.getElementById('spatialHud').innerText = `LAT: ${center.lat.toFixed(4)} | LNG: ${center.lng.toFixed(4)} | 🌡️ ${currentLiveWeather.temperatureC}°C, Wind: ${currentLiveWeather.windSpeedKmh}km/h`;
        addChatMessage('system', `🌦️ Real-Time Weather Updated: ${currentLiveWeather.temperatureC}°C, Wind ${currentLiveWeather.windSpeedKmh} km/h`);
        sendSpatialQuery("Analyze current weather conditions for this map viewport.");
      } catch (err) {
        console.error("Weather fetch failed:", err);
      }
    }

    // 2. Fetch Nearby POIs (Overpass OSM API)
    async function fetchNearbyPOIs() {
      const bounds = map.getBounds();
      const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
      const overpassQuery = `[out:json];node[~"amenity|building|shop"~"."](${bbox});out 15;`;

      try {
        addChatMessage('system', '🏢 Scanning viewport for Points of Interest (POIs)...');
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
        const data = await res.json();

        nearbyPOIData = data.elements.map(el => ({
          name: el.tags.name || 'Unnamed Asset/POI',
          type: el.tags.amenity || el.tags.building || el.tags.shop,
          lat: el.lat,
          lng: el.lon
        }));

        // Render POI Markers
        nearbyPOIData.forEach(poi => {
          L.marker([poi.lat, poi.lng]).addTo(map)
            .bindPopup(`<b>${poi.name}</b><br/>Type: ${poi.type}`);
        });

        addChatMessage('system', `🏢 Found ${nearbyPOIData.length} nearby Points of Interest.`);
        sendSpatialQuery("Summarize the Points of Interest (POIs) found in this view.");
      } catch (err) {
        console.error("POI Query failed:", err);
      }
    }

    // 3. Multi-Modal Transport Routing (OSRM Engine)
    async function calculateMultiModalRoutes(mode = 'driving') {
      if (activeRoutePolyline) map.removeLayer(activeRoutePolyline);

      const start = [7.3986, 9.0765]; // Central Substation
      const end = [7.4100, 9.0850];   // Solar Station

      const osrmMode = mode === 'walking' ? 'foot' : 'car';
      const url = `https://router.project-osrm.org/route/v1/${osrmMode}/${start.join(',')};${end.join(',')}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const route = data.routes[0];

        // Draw Route Geometry
        const routeCoordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
        activeRoutePolyline = L.polyline(routeCoordinates, { color: mode === 'walking' ? '#22c55e' : '#2563eb', weight: 5 }).addTo(map);
        map.fitBounds(activeRoutePolyline.getBounds());

        multiModalRouteData = {
          transportMode: mode,
          distanceKm: (route.distance / 1000).toFixed(2) + ' km',
          durationMinutes: Math.round(route.duration / 60) + ' mins',
          geometryPointsCount: routeCoordinates.length
        };

        addChatMessage('system', `🛣️ ${mode.toUpperCase()} Route Calculated: ${multiModalRouteData.distanceKm} (${multiModalRouteData.durationMinutes})`);
        sendSpatialQuery(`Analyze this ${mode} route calculation and compare efficiency.`);
      } catch (err) {
        console.error("OSRM Routing failed:", err);
      }
    }

    // 4. Street View Integration (Mapillary Window)
    function openStreetView() {
      const center = map.getCenter();
      const mapillaryUrl = `https://www.mapillary.com/app/?lat=${center.lat}&lng=${center.lng}&z=17`;
      window.open(mapillaryUrl, '_blank', 'width=800,height=600');
      addChatMessage('system', '📷 Opened Mapillary 360° Street View Window.');
    }

    // AI Communication Pipeline
    async function sendSpatialQuery(overridePrompt = null) {
      const input = document.getElementById('userInput');
      const text = overridePrompt || input.value.trim();
      if (!text) return;

      addChatMessage('user', text);
      if (!overridePrompt) input.value = '';

      const fullMapState = {
        userLocale: userLocale,
        viewCenter: map.getCenter(),
        zoomLevel: map.getZoom(),
        realtimeWeather: currentLiveWeather, // Live weather injected
        nearbyPOIs: nearbyPOIData,           // POIs injected
        multiModalRoute: multiModalRouteData // Transport distance/time injected
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, context: fullMapState })
        });

        const data = await res.json();
        if (data.answer) addChatMessage('ai', data.answer);
      } catch (err) {
        addChatMessage('ai', '⚠️ Error contacting Cloudflare AI worker.');
      }
    }

    function addChatMessage(sender, text) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    // Load weather on boot
    fetchRealtimeWeather();
  </script>
</body>
</html>
