<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connectgold Communication</title>
  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .meet-card {
      max-width: 400px;
      width: 100%;
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .app-branding {
      margin-bottom: 20px;
    }
    .app-branding img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .meet-card h3 {
      color: #1a73e8;
      margin: 0 0 10px 0;
      font-size: 22px;
    }
    .meet-card p {
      color: #5f6368;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .meet-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background-color: #1a73e8;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      box-sizing: border-box;
      transition: background-color 0.2s;
    }
    .meet-btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

  <div class="meet-card">
    <!-- App Branding & Logo -->
    <div class="app-branding">
      <img src="https://www.chyke.online/connectgold_2.png" alt="App Logo">
      <h3>Google Meet</h3>
    </div>
    
    <p>Click below to instantly launch a new secure video meeting in a new browser tab.</p>
    
    <!-- Method 1 Link Button -->
    <a href="https://meet.google.com/new" class="meet-btn" target="_blank" rel="noopener noreferrer">
      Start a Google Meet
    </a>
  </div>

</body>
</html>
