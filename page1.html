<script>
async function loadFeed() {
    const rssUrl = "http://feeds.bbci.co.uk/news/world/rss.xml";
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    
    try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        const feedContainer = document.getElementById('my-native-feed');
        feedContainer.innerHTML = ''; 

        const articles = data.items.slice(0, 12);
        articles.forEach((article, index) => {
            const div = document.createElement('div');
            div.className = 'news-item';
            div.innerHTML = `
                <span class="news-item-tag">${article.author || "Global News"}</span>
                <h3>${article.title}</h3>
                <div class="news-item-meta">Published: ${new Date(article.pubDate).toLocaleDateString()}</div>
                ${article.thumbnail ? `<img src="${article.thumbnail}" class="news-item-img">` : ''}
                <p>${article.description || "Read more at source."}</p>
                <div class="context-note">SkyIPworld Insight: Aggregated report for real-time awareness and event documentation.</div>
                <a href="${article.link}" target="_blank" rel="noopener" class="article-link">Read Full Report</a>
            `;
            feedContainer.appendChild(div);
        });

        attachAdListenersToLinks();
    } catch (e) {
        document.getElementById('my-native-feed').innerHTML = "Unable to load feed.";
    }
}

function attachAdListenersToLinks() {
    const links = document.querySelectorAll('.nav-links a, .article-link');
    links.forEach(link => {
        link.addEventListener('click', function() {
            if (window.AndroidApp && typeof window.AndroidApp.showInterstitial === 'function') {
                window.AndroidApp.showInterstitial();
            }
        });
    });
}

loadFeed();
</script>
