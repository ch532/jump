<script>
async function loadLiveDevArticles() {
    const feedContainer = document.getElementById('my-native-feed');
    try {
        const response = await fetch("https://dev.to/api/articles?per_page=12");
        const articles = await response.json();
        feedContainer.innerHTML = ''; 
        
        articles.forEach((article) => {
            const articleCardHTML = `
                <div class="article-card">
                    <span class="article-topic-tag">#${article.tag_list && article.tag_list.length ? article.tag_list[0] : 'Tech'}</span>
                    <h3 class="article-title">${article.title}</h3>
                    <div class="article-body">${article.description}</div>
                    <a href="${article.url}" target="_blank" class="btn-read-more article-link">Read Full Report</a>
                </div>
            `;
            feedContainer.insertAdjacentHTML('beforeend', articleCardHTML);
        });

        attachAdListenersToLinks();
    } catch (e) {
        feedContainer.innerHTML = "<p>Intelligence feed currently refreshing.</p>";
    }
}

function attachAdListenersToLinks() {
    const links = document.querySelectorAll('.nav-links a, .article-link');
    links.forEach(link => {
        link.addEventListener('click', function() {
            if (window.AndroidApp && typeof window.AndroidApp.showInterstitial === 'function') {
                window.AndroidApp.showInterstitial();
            }
        });
    });
}

loadLiveDevArticles();
</script>

<script>
  function renderAppNativeAd(headline, body, cta, mediaUrl) {
    const container = document.getElementById('admob-native-container');
    if (container) {
      document.getElementById('native-headline').innerText = headline;
      document.getElementById('native-body').innerText = body;
      document.getElementById('native-cta').innerText = cta;
      
      const mediaImg = document.getElementById('native-media');
      if (mediaUrl && mediaUrl.length > 0) {
        mediaImg.src = mediaUrl;
        mediaImg.style.display = 'block';
      } else {
        mediaImg.style.display = 'none';
      }

      container.style.opacity = '0';
      container.style.display = 'block';
      setTimeout(() => { container.style.opacity = '1'; }, 50);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    attachAdListenersToLinks();

    if (window.AndroidApp && typeof window.AndroidApp.requestNativeAd === 'function') {
      window.AndroidApp.requestNativeAd();
    }
  });
