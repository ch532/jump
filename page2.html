<script>
async function loadLiveDevArticles() {
    const feedContainer = document.getElementById('my-native-feed');
    try {
        const response = await fetch("https://dev.to/api/articles?per_page=12");
        const articles = await response.json();
        feedContainer.innerHTML = ''; 
        
        articles.forEach((article, index) => {
            const articleCardHTML = `
                <div class="article-card">
                    <span class="article-topic-tag">#${article.tag_list && article.tag_list.length ? article.tag_list[0] : 'Tech'}</span>
                    <h3 class="article-title">${article.title}</h3>
                    <div class="article-body">${article.description}</div>
                    <a href="${article.url}" target="_blank" class="btn-read-more article-link">Read Full Report</a>
                </div>
            `;
            feedContainer.insertAdjacentHTML('beforeend', articleCardHTML);

            // Inject AdSense Fluid In-Feed Ad after every 3rd article
            if ((index + 1) % 3 === 0 && index !== articles.length - 1) {
                const inFeedAdHTML = `
                    <div class="infeed-ad-wrapper">
                        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7728035806961877" crossorigin="anonymous"><\/script>
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="fluid"
                             data-ad-layout-key="+25+rv+x-4w+75"
                             data-ad-client="ca-pub-7728035806961877"
                             data-ad-slot="7362464742"></ins>
                        <script>
                             (adsbygoogle = window.adsbygoogle || []).push({});
                        <\/script>
                    </div>
                `;
                feedContainer.insertAdjacentHTML('beforeend', inFeedAdHTML);
                (window.adsbygoogle = window.adsbygoogle || []).push({});
            }
        });

        attachAdListenersToLinks();
    } catch (e) {
        feedContainer.innerHTML = "<p>Intelligence feed currently refreshing.</p>";
    }
}

function attachAdListenersToLinks() {
    const links = document.querySelectorAll('.nav-links a, .article-link');
    links.forEach(link => {
        link.addEventListener('click', function() {
            if (window.AndroidApp && typeof window.AndroidApp.showInterstitial === 'function') {
                window.AndroidApp.showInterstitial();
            }
        });
    });
}

loadLiveDevArticles();
