<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Superpro: Dungeon Chronicles</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #020205;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Mobile Play Store Device Chassis */
    #device-frame {
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 900px;
      background: #080812;
      border: 4px solid #1e293b;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 240, 255, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    @media (min-width: 451px) {
      #device-frame {
        height: 92vh;
      }
    }
    #top-status-bar {
      height: 28px;
      background: #04040a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      font-weight: 600;
      color: #8899ac;
      border-bottom: 1px solid #121824;
      z-index: 100;
      flex-shrink: 0;
    }
    #game-container {
      flex-grow: 1;
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body>

<div id="device-frame">
  <div id="top-status-bar">
    <span id="sys-time">03:45</span>
    <span style="letter-spacing: 2px;">SUPERPRO ENGINE v2.4</span>
    <span>📶 🔋 100%</span>
  </div>
  <div id="game-container"></div>
</div>

<script>
// --- LIVE CLOCK SYNC ---
setInterval(() => {
  const d = new Date();
  document.getElementById('sys-time').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}, 1000);

// --- WEB AUDIO SYNTHESIZER ---
class SoundSynth {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playShoot(type) {
    if (GameData.soundVolume <= 0) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    if (type === 'Shotgun') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, this.ctx.currentTime);
      osc.frequency.exponentialRampValueAtTime(70, this.ctx.currentTime + 0.15);
    } else if (type === 'Plasma Gun') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, this.ctx.currentTime);
      osc.frequency.exponentialRampValueAtTime(180, this.ctx.currentTime + 0.12);
    } else if (type === 'Bomb Launcher') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, this.ctx.currentTime);
      osc.frequency.exponentialRampValueAtTime(35, this.ctx.currentTime + 0.3);
    } else { // Pistol
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(550, this.ctx.currentTime);
      osc.frequency.exponentialRampValueAtTime(90, this.ctx.currentTime + 0.12);
    }

    gain.gain.setValueAtTime(GameData.soundVolume * 0.35, this.ctx.currentTime);
    gain.gain.exponentialRampValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }

  playExplosion() {
    if (GameData.soundVolume <= 0) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampValueAtTime(25, this.ctx.currentTime + 0.28);
    gain.gain.setValueAtTime(GameData.soundVolume * 0.4, this.ctx.currentTime);
    gain.gain.exponentialRampValueAtTime(0.01, this.ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.28);
  }

  playPickup() {
    if (GameData.soundVolume <= 0) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
    osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16);
    gain.gain.setValueAtTime(GameData.soundVolume * 0.4, this.ctx.currentTime);
    gain.gain.exponentialRampValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
}

const AudioFX = new SoundSynth();

// --- PERSISTENT GAME DATA ---
const SavedState = JSON.parse(localStorage.getItem('SUPERPRO_SAVE_V2')) || {};

const GameData = {
  currentLevel: SavedState.currentLevel || 1,
  totalLevels: 700,
  soundVolume: SavedState.soundVolume !== undefined ? SavedState.soundVolume : 0.8,
  inventory: SavedState.inventory || {
    coins: 100,
    ownedWeapons: ['Pistol']
  },
  premiumCatalog: [
    { name: 'Pistol', price: 0, damage: 35, speed: 650, tex: 'bullet_cyan', mode: 'single' },
    { name: 'Shotgun', price: 3500, damage: 50, speed: 600, tex: 'bullet_yellow', mode: 'spread' },
    { name: 'Plasma Gun', price: 7500, damage: 175, speed: 950, tex: 'bullet_green', mode: 'single' },
    { name: 'Bomb Launcher', price: 14000, damage: 400, speed: 480, tex: 'bullet_red', mode: 'heavy' }
  ],
  save() {
    localStorage.setItem('SUPERPRO_SAVE_V2', JSON.stringify({
      currentLevel: this.currentLevel,
      soundVolume: this.soundVolume,
      inventory: this.inventory
    }));
  }
};

// --- SCENE 0: SPLASH / LOGO INTRO SCENE ---
class SplashScene extends Phaser.Scene {
  constructor() { super('SplashScene'); }

  create() {
    const w = this.scale.width;
    const h = this.scale.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x05050a);

    const emblem = this.add.graphics();
    emblem.lineStyle(6, 0x00f0ff, 1);
    emblem.strokeCircle(w / 2, h * 0.38, 75);
    emblem.lineStyle(4, 0xff0055, 1);
    emblem.strokeRect(w / 2 - 38, h * 0.38 - 38, 76, 76);
    emblem.fillStyle(0xffea00, 1);
    emblem.fillCircle(w / 2, h * 0.38, 14);

    const logoText = this.add.text(w / 2, h * 0.58, 'SUPERPRO', {
      fontSize: '44px',
      fill: '#00f0ff',
      fontStyle: 'bold'
    }).setOrigin(0.5);

    const subText = this.add.text(w / 2, h * 0.65, 'DUNGEON CHRONICLES', {
      fontSize: '16px',
      fill: '#ff0055',
      fontStyle: 'bold'
    }).setOrigin(0.5);

    const tapText = this.add.text(w / 2, h * 0.82, 'TAP TO START GAME', {
      fontSize: '16px',
      fill: '#8899ac'
    }).setOrigin(0.5);

    this.tweens.add({
      targets: [logoText, emblem],
      scaleX: 1.06,
      scaleY: 1.06,
      duration: 900,
      yoyo: true,
      repeat: -1
    });

    this.tweens.add({
      targets: tapText,
      alpha: 0.2,
      duration: 600,
      yoyo: true,
      repeat: -1
    });

    this.input.on('pointerdown', () => {
      AudioFX.playPickup();
      this.scene.start('MenuScene');
    });
  }
}

// --- SCENE 1: MAIN MENU SCENE ---
class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }

  create() {
    const w = this.scale.width;
    const h = this.scale.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x0a0a14);

    this.add.text(w / 2, h * 0.22, 'SUPERPRO', { fontSize: '42px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(w / 2, h * 0.29, '700 Levels Story Mode', { fontSize: '16px', fill: '#8899ac' }).setOrigin(0.5);

    this.createButton(w / 2, h * 0.44, 'PLAY MISSION', () => this.scene.start('GameScene'));
    this.createButton(w / 2, h * 0.57, 'ARMORY STORE', () => this.scene.start('StoreScene'));
    this.createButton(w / 2, h * 0.70, 'SETTINGS', () => this.scene.start('SettingsScene'));
  }

  createButton(x, y, label, callback) {
    const btn = this.add.rectangle(x, y, w => w * 0.75, 54, 0x1e293b).setInteractive({ useHandCursor: true });
    btn.width = 260;
    btn.setStrokeStyle(2, 0x00f0ff);
    const txt = this.add.text(x, y, label, { fontSize: '18px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);

    btn.on('pointerdown', callback);
    btn.on('pointerover', () => btn.setFillStyle(0x334155));
    btn.on('pointerout', () => btn.setFillStyle(0x1e293b));
    return btn;
  }
}

// --- SCENE 2: GAMEPLAY SCENE ---
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.isPaused = false;
    this.playerHealth = 100;
    this.maxHealth = 100;
    this.currentWeaponIndex = 0;
    this.weaponDroppedThisLevel = false;

    this.weapons = GameData.premiumCatalog.filter(w => GameData.inventory.ownedWeapons.includes(w.name));

    this.killsThisLevel = 0;
    this.requiredKills = Math.min(4 + (GameData.currentLevel * 2), 80);
    this.portalSpawned = false;

    this.moveState = { up: false, down: false, left: false, right: false };

    const w = this.scale.width;
    const h = this.scale.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x0f0f1c);
    this.createGraphicsTextures();

    this.bullets = this.physics.add.group();
    this.enemyBullets = this.physics.add.group();
    this.enemies = this.physics.add.group();
    this.drops = this.physics.add.group();

    this.player = this.physics.add.sprite(w * 0.5, h * 0.45, 'player_tex').setCollideWorldBounds(true);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });

    this.spawnTimer = this.time.addEvent({
      delay: 2200,
      callback: () => this.maintainEnemyPopulation(),
      loop: true
    });
    this.maintainEnemyPopulation();

    this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
    this.physics.add.overlap(this.enemyBullets, this.player, this.hitPlayer, null, this);
    this.physics.add.overlap(this.player, this.drops, this.pickupItem, null, this);

    this.createHUD();
    this.createOnScreenControls();

    this.input.keyboard.on('keydown-ESC', () => this.togglePauseMenu());
  }

  createGraphicsTextures() {
    if (!this.textures.exists('player_tex')) {
      const pG = this.make.graphics({add: false});
      pG.fillStyle(0x00f0ff, 1);
      pG.fillCircle(14, 14, 14);
      pG.generateTexture('player_tex', 28, 28);

      const eG = this.make.graphics({add: false});
      eG.fillStyle(0xff0055, 1);
      eG.fillRect(0, 0, 26, 26);
      eG.generateTexture('enemy_std', 26, 26);

      const eFast = this.make.graphics({add: false});
      eFast.fillStyle(0xffea00, 1);
      eFast.fillRect(0, 0, 20, 20);
      eFast.generateTexture('enemy_fast', 20, 20);

      const eTank = this.make.graphics({add: false});
      eTank.fillStyle(0xa855f7, 1);
      eTank.fillRect(0, 0, 36, 36);
      eTank.generateTexture('enemy_tank', 36, 36);

      const bCyan = this.make.graphics({add: false});
      bCyan.fillStyle(0x00f0ff, 1);
      bCyan.fillCircle(4, 4, 4);
      bCyan.generateTexture('bullet_cyan', 8, 8);

      const bYellow = this.make.graphics({add: false});
      bYellow.fillStyle(0xffea00, 1);
      bYellow.fillCircle(3, 3, 3);
      bYellow.generateTexture('bullet_yellow', 6, 6);

      const bGreen = this.make.graphics({add: false});
      bGreen.fillStyle(0x00ff66, 1);
      bGreen.fillRect(0, 0, 10, 4);
      bGreen.generateTexture('bullet_green', 10, 4);

      const bRed = this.make.graphics({add: false});
      bRed.fillStyle(0xff0055, 1);
      bRed.fillCircle(6, 6, 6);
      bRed.generateTexture('bullet_red', 12, 12);

      const dHealth = this.make.graphics({add: false});
      dHealth.fillStyle(0x00ff66, 1);
      dHealth.fillRect(0, 0, 18, 18);
      dHealth.generateTexture('drop_health', 18, 18);

      const dWpn = this.make.graphics({add: false});
      dWpn.fillStyle(0xffa500, 1);
      dWpn.fillRect(0, 0, 18, 18);
      dWpn.generateTexture('drop_weapon', 18, 18);

      const portalG = this.make.graphics({add: false});
      portalG.fillStyle(0xa855f7, 1);
      portalG.fillCircle(20, 20, 20);
      portalG.lineStyle(3, 0x00f0ff, 1);
      portalG.strokeCircle(20, 20, 20);
      portalG.generateTexture('portal_tex', 40, 40);
    }
  }

  createOnScreenControls() {
    const w = this.scale.width;
    const h = this.scale.height;

    // Directional D-Pad (Left Bottom)
    const dpadX = 100;
    const dpadY = h - 140;
    const offset = 65;

    this.createTouchBtn(dpadX, dpadY - offset, '▲', () => this.moveState.up = true, () => this.moveState.up = false);
    this.createTouchBtn(dpadX, dpadY + offset, '▼', () => this.moveState.down = true, () => this.moveState.down = false);
    this.createTouchBtn(dpadX - offset, dpadY, '◄', () => this.moveState.left = true, () => this.moveState.left = false);
    this.createTouchBtn(dpadX + offset, dpadY, '►', () => this.moveState.right = true, () => this.moveState.right = false);

    // Fire Button (Right Bottom)
    const fireBtn = this.add.circle(w - 95, h - 140, 60, 0xff0055, 0.9).setInteractive({ useHandCursor: true });
    fireBtn.setStrokeStyle(4, 0xffffff);
    this.add.text(w - 95, h - 140, 'FIRE', { fontSize: '20px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

    fireBtn.on('pointerdown', () => this.fireAtClosestEnemy());
  }

  createTouchBtn(x, y, symbol, onDown, onUp) {
    const btn = this.add.rectangle(x, y, 54, 54, 0x1e293b, 0.9).setInteractive({ useHandCursor: true });
    btn.setStrokeStyle(2, 0x00f0ff);
    const txt = this.add.text(x, y, symbol, { fontSize: '24px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);

    btn.on('pointerdown', () => { btn.setFillStyle(0x334155); onDown(); });
    btn.on('pointerup', () => { btn.setFillStyle(0x1e293b); onUp(); });
    btn.on('pointerout', () => { btn.setFillStyle(0x1e293b); onUp(); });
  }

  fireAtClosestEnemy() {
    if (this.isPaused) return;

    let targetX = this.player.x;
    let targetY = this.player.y - 200;

    let closestEnemy = null;
    let minDist = 9999;

    this.enemies.getChildren().forEach((enemy) => {
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
      if (dist < minDist) {
        minDist = dist;
        closestEnemy = enemy;
      }
    });

    if (closestEnemy) {
      targetX = closestEnemy.x;
      targetY = closestEnemy.y;
    }

    const activeWpn = this.weapons[this.currentWeaponIndex];
    AudioFX.playShoot(activeWpn.name);

    if (activeWpn.mode === 'spread') {
      const baseAngle = Phaser.Math.Angle.Between(this.player.x, this.player.y, targetX, targetY);
      [-0.2, 0, 0.2].forEach((spreadOffset) => {
        const b = this.bullets.create(this.player.x, this.player.y, activeWpn.tex);
        const angle = baseAngle + spreadOffset;
        this.physics.velocityFromRotation(angle, activeWpn.speed, b.body.velocity);
      });
    } else {
      const bullet = this.bullets.create(this.player.x, this.player.y, activeWpn.tex);
      this.physics.moveTo(bullet, targetX, targetY, activeWpn.speed);
    }
  }

  maintainEnemyPopulation() {
    if (this.isPaused) return;

    const w = this.scale.width;
    const h = this.scale.height;
    const currentEnemyCount = this.enemies.countActive();
    const maxActiveEnemies = Math.min(3 + Math.floor(GameData.currentLevel * 0.6), 14);

    if (currentEnemyCount < maxActiveEnemies) {
      const x = Phaser.Math.Between(40, w - 40);
      const y = Phaser.Math.Between(70, h * 0.35);

      const roll = Math.random();
      let texKey = 'enemy_std';
      let speed = 90;
      let hp = 30 + (GameData.currentLevel * 5);
      let enemyRank = 1;

      if (roll > 0.75) {
        texKey = 'enemy_fast';
        speed = 145;
        hp = 20 + (GameData.currentLevel * 3);
        enemyRank = 2;
      } else if (roll < 0.2) {
        texKey = 'enemy_tank';
        speed = 55;
        hp = 90 + (GameData.currentLevel * 10);
        enemyRank = 3;
      }

      const enemy = this.enemies.create(x, y, texKey);
      enemy.setCollideWorldBounds(true);
      enemy.health = hp;
      enemy.baseSpeed = speed;
      enemy.rank = enemyRank;

      enemy.shootTimer = this.time.addEvent({
        delay: Math.max(1200, 3000 - GameData.currentLevel * 12),
        callback: () => this.enemyShoot(enemy),
        loop: true
      });
    }
  }

  enemyShoot(enemy) {
    if (!enemy.active || this.isPaused) return;
    const bullet = this.enemyBullets.create(enemy.x, enemy.y, 'bullet_yellow');
    this.physics.moveToObject(bullet, this.player, 280);
  }

  hitEnemy(bullet, enemy) {
    bullet.destroy();
    const wpnDamage = this.weapons[this.currentWeaponIndex].damage;
    enemy.health -= wpnDamage;

    this.showFloatingText(enemy.x, enemy.y, `-${wpnDamage}`, '#00f0ff');

    if (enemy.health <= 0) {
      if (enemy.shootTimer) enemy.shootTimer.remove();

      AudioFX.playExplosion();
      this.createExplosionParticles(enemy.x, enemy.y);

      GameData.inventory.coins += 10;
      GameData.save();

      this.showFloatingText(enemy.x, enemy.y, '+10 💰', '#ffea00');

      if (this.playerHealth < 40 && Math.random() > 0.5) {
        const drop = this.drops.create(enemy.x, enemy.y, 'drop_health');
        drop.dropType = 'HEALTH';
      } 
      else if (GameData.currentLevel % 3 === 0 && enemy.rank >= 2 && !this.weaponDroppedThisLevel) {
        const drop = this.drops.create(enemy.x, enemy.y, 'drop_weapon');
        drop.dropType = 'WEAPON';
        this.weaponDroppedThisLevel = true;
      }

      enemy.destroy();
      this.killsThisLevel++;
      this.updateHUD();

      if (this.killsThisLevel >= this.requiredKills && !this.portalSpawned) {
        this.spawnLevelPortal();
      }
    }
  }

  showFloatingText(x, y, message, color) {
    const txt = this.add.text(x, y, message, { fontSize: '14px', fill: color, fontStyle: 'bold' }).setOrigin(0.5);
    this.tweens.add({
      targets: txt,
      y: y - 35,
      alpha: 0,
      duration: 600,
      onComplete: () => txt.destroy()
    });
  }

  createExplosionParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      const p = this.add.circle(x, y, 3, 0xff0055);
      this.physics.add.existing(p);
      p.body.setVelocity(Phaser.Math.Between(-100, 100), Phaser.Math.Between(-100, 100));
      this.tweens.add({ targets: p, alpha: 0, duration: 250, onComplete: () => p.destroy() });
    }
  }

  spawnLevelPortal() {
    this.portalSpawned = true;
    AudioFX.playPickup();
    const w = this.scale.width;
    const h = this.scale.height;

    const portalX = w / 2;
    const portalY = h * 0.25;

    this.portal = this.physics.add.sprite(portalX, portalY, 'portal_tex');
    this.physics.add.overlap(this.player, this.portal, this.enterPortal, null, this);
    
    const banner = this.add.text(portalX, portalY - 35, 'PORTAL OPEN 🟣', { fontSize: '16px', fill: '#a855f7', fontStyle: 'bold' }).setOrigin(0.5);
    this.tweens.add({ targets: banner, scaleX: 1.1, scaleY: 1.1, duration: 400, yoyo: true, repeat: -1 });
    
    this.updateHUD();
  }

  enterPortal(player, portal) {
    GameData.currentLevel++;
    GameData.save();

    if (GameData.currentLevel > GameData.totalLevels) {
      alert("VICTORY! You cleared all 700 Levels!");
      this.scene.start('MenuScene');
    } else {
      this.scene.restart();
    }
  }

  hitPlayer(player, bullet) {
    bullet.destroy();
    this.playerHealth -= 15;
    this.updateHUD();

    this.cameras.main.shake(100, 0.01);

    if (this.playerHealth <= 0) {
      alert("MISSION FAILED! Restarting Level " + GameData.currentLevel);
      this.scene.restart();
    }
  }

  pickupItem(player, drop) {
    AudioFX.playPickup();

    if (drop.dropType === 'HEALTH') {
      this.playerHealth = Math.min(this.maxHealth, this.playerHealth + 45);
      this.showFloatingText(player.x, player.y - 20, '+45 HP', '#00ff66');
    } else if (drop.dropType === 'WEAPON') {
      this.currentWeaponIndex = (this.currentWeaponIndex + 1) % this.weapons.length;
      this.showFloatingText(player.x, player.y - 20, 'WEAPON UPGRADED!', '#ffa500');
    }
    drop.destroy();
    this.updateHUD();
  }

  createHUD() {
    const w = this.scale.width;
    this.hudText = this.add.text(12, 10, '', { fontSize: '12px', fill: '#00f0ff', fontStyle: 'bold' });
    
    this.pauseBtn = this.add.text(w - 65, 10, 'PAUSE', { fontSize: '14px', fill: '#ffea00', fontStyle: 'bold' })
      .setInteractive({ useHandCursor: true })
      .on('pointerdown', () => this.togglePauseMenu());

    this.updateHUD();
  }

  updateHUD() {
    const wpn = this.weapons[this.currentWeaponIndex].name;
    const portalStatus = this.portalSpawned ? 'OPEN' : `${this.killsThisLevel}/${this.requiredKills}`;
    this.hudText.setText(`L:${GameData.currentLevel} | HP:${this.playerHealth} | K:${portalStatus} | W:${wpn}`);
  }

  update() {
    if (this.isPaused) return;

    let vx = 0;
    let vy = 0;
    const speed = 210;

    if (this.cursors.left.isDown || this.wasd.left.isDown || this.moveState.left) vx -= speed;
    if (this.cursors.right.isDown || this.wasd.right.isDown || this.moveState.right) vx += speed;
    if (this.cursors.up.isDown || this.wasd.up.isDown || this.moveState.up) vy -= speed;
    if (this.cursors.down.isDown || this.wasd.down.isDown || this.moveState.down) vy += speed;

    this.player.setVelocity(vx, vy);

    this.enemies.getChildren().forEach((enemy) => {
      this.physics.moveToObject(enemy, this.player, enemy.baseSpeed + (GameData.currentLevel * 1.5));
    });
  }

  togglePauseMenu() {
    this.isPaused = !this.isPaused;

    const w = this.scale.width;
    const h = this.scale.height;

    if (this.isPaused) {
      this.physics.pause();
      this.pauseOverlay = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.85);
      this.pauseTitle = this.add.text(w / 2, h * 0.32, 'PAUSED', { fontSize: '32px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);

      this.resumeBtn = this.createPauseBtn(w / 2, h * 0.44, 'RESUME', () => this.togglePauseMenu());
      this.restartBtn = this.createPauseBtn(w / 2, h * 0.54, 'RESTART', () => { this.scene.restart(); });
      this.quitBtn = this.createPauseBtn(w / 2, h * 0.64, 'MAIN MENU', () => { this.scene.start('MenuScene'); });
    } else {
      this.physics.resume();
      if (this.pauseOverlay) this.pauseOverlay.destroy();
      if (this.pauseTitle) this.pauseTitle.destroy();
      if (this.resumeBtn) this.resumeBtn.destroy();
      if (this.restartBtn) this.restartBtn.destroy();
      if (this.quitBtn) this.quitBtn.destroy();
    }
  }

  createPauseBtn(x, y, label, callback) {
    const container = this.add.container(x, y);
    const bg = this.add.rectangle(0, 0, 200, 42, 0x1e293b).setInteractive({ useHandCursor: true });
    bg.setStrokeStyle(2, 0x00f0ff);
    const txt = this.add.text(0, 0, label, { fontSize: '15px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
    container.add([bg, txt]);
    bg.on('pointerdown', callback);
    return container;
  }
}

// --- SCENE 3: STORE & INVENTORY SCENE ---
class StoreScene extends Phaser.Scene {
  constructor() { super('StoreScene'); }

  create() {
    const w = this.scale.width;
    const h = this.scale.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x0a0a14);

    this.add.text(w / 2, 45, 'ARMORY STORE', { fontSize: '24px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
    this.coinText = this.add.text(w / 2, 80, `Balance: ${GameData.inventory.coins} COINS 💰`, { fontSize: '16px', fill: '#ffea00' }).setOrigin(0.5);

    let startY = 135;
    GameData.premiumCatalog.forEach((wpn) => {
      const isOwned = GameData.inventory.ownedWeapons.includes(wpn.name);
      
      this.add.rectangle(w / 2, startY, w * 0.88, 65, 0x1e293b).setStrokeStyle(1, 0x334155);
      this.add.text(w * 0.1, startY - 12, wpn.name, { fontSize: '16px', fill: '#ffffff', fontStyle: 'bold' });
      this.add.text(w * 0.1, startY + 10, `DMG: ${wpn.damage} | SPD: ${wpn.speed}`, { fontSize: '12px', fill: '#8899ac' });

      if (isOwned) {
        this.add.text(w * 0.78, startY, 'OWNED', { fontSize: '14px', fill: '#00ff66', fontStyle: 'bold' }).setOrigin(0.5);
      } else {
        const buyBtn = this.add.rectangle(w * 0.78, startY, 95, 34, 0x00f0ff).setInteractive({ useHandCursor: true });
        const buyTxt = this.add.text(w * 0.78, startY, `${wpn.price}C`, { fontSize: '14px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5);

        buyBtn.on('pointerdown', () => {
          if (GameData.inventory.coins >= wpn.price) {
            GameData.inventory.coins -= wpn.price;
            GameData.inventory.ownedWeapons.push(wpn.name);
            GameData.save();
            alert(`Unlocked ${wpn.name}!`);
            this.scene.restart();
          } else {
            alert('Insufficient coins! Play missions to earn more.');
          }
        });
      }
      startY += 80;
    });

    const backBtn = this.add.rectangle(w / 2, h - 50, 200, 42, 0x1e293b).setInteractive({ useHandCursor: true });
    backBtn.setStrokeStyle(2, 0x00f0ff);
    this.add.text(w / 2, h - 50, 'BACK TO MENU', { fontSize: '15px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => this.scene.start('MenuScene'));
  }
}

// --- SCENE 4: SETTINGS SCENE ---
class SettingsScene extends Phaser.Scene {
  constructor() { super('SettingsScene'); }

  create() {
    const w = this.scale.width;
    const h = this.scale.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x0a0a14);

    this.add.text(w / 2, 60, 'SETTINGS', { fontSize: '26px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);

    this.volText = this.add.text(w / 2, h * 0.35, `Volume: ${Math.round(GameData.soundVolume * 100)}%`, { fontSize: '20px', fill: '#ffffff' }).setOrigin(0.5);

    const minusBtn = this.add.rectangle(w / 2 - 80, h * 0.48, 50, 50, 0x1e293b).setInteractive({ useHandCursor: true });
    minusBtn.setStrokeStyle(2, 0xff0055);
    this.add.text(w / 2 - 80, h * 0.48, '-', { fontSize: '30px', fill: '#ff0055', fontStyle: 'bold' }).setOrigin(0.5);

    const plusBtn = this.add.rectangle(w / 2 + 80, h * 0.48, 50, 50, 0x1e293b).setInteractive({ useHandCursor: true });
    plusBtn.setStrokeStyle(2, 0x00ff66);
    this.add.text(w / 2 + 80, h * 0.48, '+', { fontSize: '30px', fill: '#00ff66', fontStyle: 'bold' }).setOrigin(0.5);

    minusBtn.on('pointerdown', () => {
      GameData.soundVolume = Math.max(0, GameData.soundVolume - 0.1);
      GameData.save();
      this.volText.setText(`Volume: ${Math.round(GameData.soundVolume * 100)}%`);
    });

    plusBtn.on('pointerdown', () => {
      GameData.soundVolume = Math.min(1, GameData.soundVolume + 0.1);
      GameData.save();
      this.volText.setText(`Volume: ${Math.round(GameData.soundVolume * 100)}%`);
    });

    const backBtn = this.add.rectangle(w / 2, h - 80, 200, 42, 0x1e293b).setInteractive({ useHandCursor: true });
    backBtn.setStrokeStyle(2, 0x00f0ff);
    this.add.text(w / 2, h - 80, 'BACK TO MENU', { fontSize: '15px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => this.scene.start('MenuScene'));
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 414,
    height: 736
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: [SplashScene, MenuScene, GameScene, StoreScene, SettingsScene]
};

const game = new Phaser.Game(config);
</script>
