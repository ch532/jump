<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare AI Multi-Persona Terminal</title>
  
  <!-- Tailwind CSS for Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Marked.js for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- MathJax for Rendering LaTeX Math & Science Equations -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* Styling for rendered Markdown output */
    .prose p { margin-bottom: 0.75rem; }
    .prose h1, .prose h2, .prose h3 { font-weight: 700; color: #f3f4f6; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
    .prose code { font-family: monospace; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 via-indigo-400 to-teal-400 bg-clip-text text-transparent">
        Multi-Persona AI System
      </h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-mono">
        Worker Active
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- Persona Selection Tabs -->
    <div class="grid grid-cols-3 gap-3 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
      <button onclick="selectPersona('math_science')" id="btn-math_science"
        class="persona-btn flex flex-col items-center justify-center p-3 rounded-lg border transition-all duration-200 bg-slate-800 border-indigo-500/50 text-indigo-300 shadow-md">
        <span class="font-bold text-sm">Newton-AI</span>
        <span class="text-xs opacity-75">Math & Science</span>
      </button>

      <button onclick="selectPersona('problem_solver')" id="btn-problem_solver"
        class="persona-btn flex flex-col items-center justify-center p-3 rounded-lg border border-transparent transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-900">
        <span class="font-bold text-sm">Nexus-AI</span>
        <span class="text-xs opacity-75">Systems Architect</span>
      </button>

      <button onclick="selectPersona('software_dev')" id="btn-software_dev"
        class="persona-btn flex flex-col items-center justify-center p-3 rounded-lg border border-transparent transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-900">
        <span class="font-bold text-sm">Turing-AI</span>
        <span class="text-xs opacity-75">Senior Developer</span>
      </button>
    </div>

    <!-- Response Display Card -->
    <div class="flex-1 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 min-h-[300px] flex flex-col relative overflow-hidden shadow-2xl">
      
      <!-- Video Player (Hidden by default, shown automatically when videoUrl exists) -->
      <div id="videoContainer" class="hidden mb-6 rounded-xl overflow-hidden border border-slate-700/60 bg-black shadow-lg">
        <div class="bg-slate-900/80 px-4 py-2 border-b border-slate-800 text-xs font-mono text-indigo-400 flex items-center justify-between">
          <span>🎬 SCIENTIFIC ANIMATION RENDER</span>
          <span class="text-slate-500">Auto-Generated</span>
        </div>
        <video id="videoPlayer" class="w-full max-h-[360px] object-contain" controls autoplay loop muted>
          <source id="videoSource" src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>

      <!-- Markdown / AI Answer Area -->
      <div id="responseArea" class="prose text-slate-200 flex-1 overflow-y-auto">
        <p class="text-slate-500 italic">Select a persona, type your prompt below, and press send to initiate inference...</p>
      </div>

      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3">
        <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-400 font-mono animate-pulse">Running Cloudflare Workers AI Inference...</p>
      </div>
    </div>

    <!-- Input Form -->
    <form id="aiForm" onsubmit="handleSubmit(event)" class="flex gap-3">
      <input
        type="text"
        id="promptInput"
        placeholder="Ask a question or request code..."
        required
        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80 focus:ring-1 focus:ring-indigo-500/80 transition-all duration-200"
      />
      <button
        type="submit"
        id="submitBtn"
        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-500/20 flex items-center gap-2"
      >
        <span>Send</span>
      </button>
    </form>
  </main>

  <!-- JavaScript Client Logic -->
  <script>
    const WORKER_URL = "https://restless-lab-5821.trustconnect713.workers.dev/";
    let currentPersona = "math_science";

    function selectPersona(persona) {
      currentPersona = persona;
      
      // Update Tab Styles
      document.querySelectorAll('.persona-btn').forEach(btn => {
        btn.className = "persona-btn flex flex-col items-center justify-center p-3 rounded-lg border border-transparent transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
      });

      const activeBtn = document.getElementById(`btn-${persona}`);
      activeBtn.className = "persona-btn flex flex-col items-center justify-center p-3 rounded-lg border transition-all duration-200 bg-slate-800 border-indigo-500/50 text-indigo-300 shadow-md";
    }

    async function handleSubmit(e) {
      e.preventDefault();
      
      const promptInput = document.getElementById('promptInput');
      const responseArea = document.getElementById('responseArea');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const videoContainer = document.getElementById('videoContainer');
      const videoPlayer = document.getElementById('videoPlayer');
      const videoSource = document.getElementById('videoSource');
      const submitBtn = document.getElementById('submitBtn');

      const promptText = promptInput.value.trim();
      if (!promptText) return;

      // UI State Updates
      loadingOverlay.classList.remove('hidden');
      submitBtn.disabled = true;
      videoContainer.classList.add('hidden');
      videoPlayer.pause();

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: promptText,
            persona: currentPersona
          })
        });

        const data = await response.json();

        if (data.error) {
          responseArea.innerHTML = `<p class="text-rose-400 font-mono">Error: ${data.error}</p>`;
        } else {
          // Parse Markdown text
          responseArea.innerHTML = marked.parse(data.answer);

          // Trigger Highlight.js on code blocks
          responseArea.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
          });

          // Trigger MathJax re-render for LaTeX formulas
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([responseArea]);
          }

          // Handle Video Auto-Render
          if (data.videoUrl) {
            videoSource.src = data.videoUrl;
            videoPlayer.load();
            videoContainer.classList.remove('hidden');
            videoPlayer.play();
          }
        }
      } catch (err) {
        responseArea.innerHTML = `<p class="text-rose-400 font-mono">Network Error: ${err.message}</p>`;
      } finally {
        loadingOverlay.classList.add('hidden');
        submitBtn.disabled = false;
        promptInput.value = "";
      }
    }
  </script>
</body>
</html>
