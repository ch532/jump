<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Autonomous Environmental Cascade Engine</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
    }
    .prose p { margin-bottom: 0.75rem; }
    .prose h1, .prose h2, .prose h3 { font-weight: 700; color: #f3f4f6; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
    .prose code { font-family: monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur p-4 shrink-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-teal-400 via-emerald-400 to-indigo-400 bg-clip-text text-transparent">
          Cross-Domain Cascade AI Engine
        </h1>
        <p class="text-xs text-slate-400 font-mono">Agriculture • Land • Water • Atmosphere</p>
      </div>
      
      <!-- Speech Status Toggle -->
      <button onclick="toggleSpeech()" id="speechToggleBtn" class="flex items-center gap-2 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full font-mono hover:bg-emerald-500/20 transition">
        <span id="speechStatusIcon">🔊</span>
        <span id="speechStatusText">Voice Output: ON</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="mainContainer" class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 overflow-y-auto min-h-0">

    <!-- Left Panel: Telemetry Controls -->
    <div class="w-full md:w-1/2 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 shrink-0 shadow-xl">
      <h2 class="text-xs font-semibold text-teal-400 font-mono uppercase tracking-wider border-b border-slate-800 pb-2">
        📡 Sensor Telemetry Controls
      </h2>

      <div class="grid grid-cols-2 gap-3 text-xs flex-1">
        <div>
          <label class="text-slate-400 font-mono">Atmosphere: Rain (mm/h)</label>
          <input type="number" id="rainRate" value="15" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-slate-400 font-mono">Agriculture: Soil Sat (%)</label>
          <input type="number" id="soilSat" value="40" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-slate-400 font-mono">Land: Slope Angle (°)</label>
          <input type="number" id="slopeTilt" value="12" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-slate-400 font-mono">Water: Stream Depth (m)</label>
          <input type="number" id="waterLevel" value="1.8" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-slate-400 font-mono">AQI Level (PPM)</label>
          <input type="number" id="aqiLevel" value="55" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-slate-400 font-mono">Ground Vibration (Hz)</label>
          <input type="number" id="vibration" value="1.2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white mt-1 focus:border-emerald-500 focus:outline-none" />
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="evaluateEnvironment()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 text-xs">
          Run Live Worker Inference
        </button>
        <button onclick="triggerSimulatedDisaster()" class="bg-rose-500/20 border border-rose-500/40 text-rose-300 hover:bg-rose-500/30 px-3 py-3 rounded-xl transition text-xs">
          Simulate Hazard
        </button>
      </div>
    </div>

    <!-- Right Panel: AI Reasoning & Voice Output -->
    <div class="w-full md:w-1/2 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col relative overflow-hidden shadow-xl min-h-[250px]">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
        <h2 class="text-xs font-semibold text-teal-400 font-mono uppercase tracking-wider">
          ⚡ AI Diagnostic Output
        </h2>
        <span id="gatewayBadge" class="text-[10px] bg-slate-800 border border-slate-700 text-slate-400 px-2 py-0.5 rounded font-mono">
          connectgold-gateway
        </span>
      </div>

      <div id="responseArea" class="prose text-xs text-slate-200 flex-1 overflow-y-auto pr-1">
        <p class="text-slate-500 italic">Adjust telemetry inputs on the left and trigger inference...</p>
      </div>

      <button onclick="speakLastResponse()" class="mt-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2 rounded-xl text-xs flex items-center justify-center gap-2 transition shrink-0">
        <span>🔊 Re-broadcast Voice Diagnostic</span>
      </button>

      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
        <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-400 font-mono animate-pulse">Running Cascade AI Inference via Gateway...</p>
      </div>

    </div>

  </main>

  <script>
    const WORKER_URL = "https://blue-snowflake-3fb9.trustconnect713.workers.dev/";
    let isSpeechEnabled = true;
    let lastAiResponse = "System is ready for environmental diagnostic inference.";

    function toggleSpeech() {
      isSpeechEnabled = !isSpeechEnabled;
      const statusIcon = document.getElementById('speechStatusIcon');
      const statusText = document.getElementById('speechStatusText');

      if (isSpeechEnabled) {
        statusIcon.innerText = '🔊';
        statusText.innerText = 'Voice Output: ON';
      } else {
        statusIcon.innerText = '🔇';
        statusText.innerText = 'Voice Output: OFF';
        window.speechSynthesis.cancel();
      }
    }

    function speakText(text) {
      if (!isSpeechEnabled || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      let cleanText = text
        .replace(/```[\s\S]*?```/g, '')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/[*#_~]/g, '');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      utterance.lang = navigator.language || 'en-US';

      window.speechSynthesis.speak(utterance);
    }

    function speakLastResponse() {
      speakText(lastAiResponse);
    }

    async function evaluateEnvironment() {
      const responseArea = document.getElementById('responseArea');
      const loadingOverlay = document.getElementById('loadingOverlay');

      const payload = {
        atmospheric: {
          rainfall_rate_mm_hr: parseFloat(document.getElementById('rainRate').value),
          aqi: parseFloat(document.getElementById('aqiLevel').value)
        },
        agricultural: {
          soil_saturation_percent: parseFloat(document.getElementById('soilSat').value)
        },
        land: {
          slope_tilt_degrees: parseFloat(document.getElementById('slopeTilt').value),
          ground_vibration_hz: parseFloat(document.getElementById('vibration').value)
        },
        water: {
          surface_water_level_m: parseFloat(document.getElementById('waterLevel').value)
        }
      };

      loadingOverlay.classList.remove('hidden');
      window.speechSynthesis.cancel();

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          responseArea.innerHTML = `<p class="text-rose-400 font-mono">Error: ${data.error}</p>`;
        } else {
          lastAiResponse = data.aiAnalysis;
          responseArea.innerHTML = marked.parse(data.aiAnalysis);

          speakText(data.aiAnalysis);
        }
      } catch (err) {
        responseArea.innerHTML = `<p class="text-rose-400 font-mono">Network Error: ${err.message}</p>`;
      } finally {
        loadingOverlay.classList.add('hidden');
      }
    }

    function triggerSimulatedDisaster() {
      document.getElementById('rainRate').value = 85;
      document.getElementById('soilSat').value = 94;
      document.getElementById('slopeTilt').value = 24;
      document.getElementById('waterLevel').value = 4.8;
      document.getElementById('aqiLevel').value = 180;
      document.getElementById('vibration').value = 5.5;
      evaluateEnvironment();
    }
  </script>
</body>
</html>
