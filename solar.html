<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltaic</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 0.05em;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button:hover, select:hover {
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vector-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .vector-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .vector-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .vector-value {
            font-size: 1rem;
            font-weight: 600;
            font-family: monospace;
        }

        .ai-box {
            background: rgba(15, 23, 42, 0.8);
            border-left: 4px solid var(--accent-color);
            padding: 16px;
            border-radius: 4px;
            font-style: italic;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SOLTAIC TELEMETRY</h1>
            <div class="controls">
                <select id="locationSelect" onchange="fetchTelemetry()">
                    <option value="Abuja">Abuja</option>
                    <option value="Lagos">Lagos</option>
                    <option value="London">London</option>
                    <option value="New York">New York</option>
                </select>
                <button onclick="fetchTelemetry()">Refresh Mesh</button>
            </div>
        </header>

        <div class="grid">
            <!-- In-Phone Runtime Entropy Card -->
            <div class="card">
                <h2>In-Phone Runtime Entropy</h2>
                <ul id="inPhoneList" class="vector-list">
                    <!-- Populated dynamically -->
                </ul>
            </div>

            <!-- Off-Phone Atmospheric Vectors Card -->
            <div class="card">
                <h2>Off-Phone Atmospheric</h2>
                <ul id="offPhoneList" class="vector-list">
                    <!-- Populated dynamically -->
                </ul>
            </div>

            <!-- AI Analytics Card -->
            <div class="card full-width">
                <h2>Edge LLM Assessment</h2>
                <div id="aiAnalysis" class="ai-box">Connecting to secure enclave telemetry stream...</div>
                <div id="statusBar" class="status-bar">Status: Idle</div>
            </div>
        </div>
    </div>

    <script>
        // Your deployed Cloudflare Worker endpoint URL
        const WORKER_URL = "https://odd-mouse-0ed0.trustconnect713.workers.dev/";

        async function fetchTelemetry() {
            const location = document.getElementById('locationSelect').value;
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = "Status: Polling edge worker...";

            try {
                // Generate dynamic pseudo-client runtime attributes to pass along
                const jitter = (Math.random() * 0.8 + 1.0).toFixed(3);
                const heap = (Math.random() * 10 + 30).toFixed(2);

                const response = await fetch(`${WORKER_URL}?location=${location}&jitter=${jitter}&heap=${heap}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                renderTelemetry(data);
                statusBar.textContent = `Status: Synced at ${new Date(data.timestamp).toLocaleTimeString()}`;
            } catch (err) {
                console.error("Fetch error:", err);
                statusBar.textContent = "Status: Error syncing with edge node.";
            }
        }

        function renderTelemetry(data) {
            // Render In-Phone Vectors (10 items)
            const inPhoneContainer = document.getElementById('inPhoneList');
            inPhoneContainer.innerHTML = '';
            data.inPhone.forEach((val, index) => {
                inPhoneContainer.innerHTML += `
                    <li class="vector-item">
                        <span class="vector-label">Entropy #${index + 1}</span>
                        <span class="vector-value">${val}</span>
                    </li>
                `;
            });

            // Render Off-Phone Vectors (10 items)
            const offPhoneContainer = document.getElementById('offPhoneList');
            offPhoneContainer.innerHTML = '';
            data.offPhone.forEach((val, index) => {
                offPhoneContainer.innerHTML += `
                    <li class="vector-item">
                        <span class="vector-label">Atmosphere #${index + 1}</span>
                        <span class="vector-value">${val}</span>
                    </li>
                `;
            });

            // Render AI Analysis
            document.getElementById('aiAnalysis').textContent = data.aiAnalysis;
        }

        // Initial fetch on page load
        window.onload = fetchTelemetry;
    </script>
</body>
</html>
