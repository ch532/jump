<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltaic | Autonomous Telemetry Platform</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 0.05em;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="text"] {
            outline: none;
            width: 180px;
        }

        input[type="text"]:focus, button:hover {
            border-color: var(--accent-color);
        }

        button {
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--accent-color);
        }

        .vector-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .vector-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .vector-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .vector-value {
            font-size: 0.95rem;
            font-weight: 600;
            font-family: monospace;
            color: var(--text-main);
        }

        .unit {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: normal;
            margin-left: 2px;
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
            text-align: right;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SOLTAIC TELEMETRY</h1>
            <div class="controls">
                <input type="text" id="locationInput" value="Abuja" placeholder="Enter city/country..." onkeypress="handleKeyPress(event)">
                <button onclick="fetchTelemetry()">Query Mesh</button>
            </div>
        </header>

        <div class="grid">
            <!-- In-Phone Runtime Entropy Card -->
            <div class="card">
                <h2>In-Phone Runtime Entropy</h2>
                <ul id="inPhoneList" class="vector-list"></ul>
            </div>

            <!-- Off-Phone Atmospheric Vectors Card -->
            <div class="card">
                <h2>Off-Phone Atmospheric</h2>
                <ul id="offPhoneList" class="vector-list"></ul>
            </div>

            <div id="statusBar" class="status-bar">Status: Idle</div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://odd-mouse-0ed0.trustconnect713.workers.dev/";

        const inPhoneConfig = [
            { label: "Net Jitter", unit: "ms" },
            { label: "Heap Alloc", unit: "MB" },
            { label: "CPU Load", unit: "%" },
            { label: "Thread Skew", unit: "ms" },
            { label: "Battery Temp", unit: "°C" },
            { label: "Signal RSSI", unit: "dBm" },
            { label: "IO Latency", unit: "ms" },
            { label: "Sensor Drift", unit: "rad" },
            { label: "Voltage Rail", unit: "V" },
            { label: "Entropy Pool", unit: "bits" }
        ];

        const offPhoneConfig = [
            { label: "Geo Vector", unit: "rad" },
            { label: "Baro Pressure", unit: "hPa" },
            { label: "Rel Humidity", unit: "%" },
            { label: "Surface Trend", unit: "hPa" },
            { label: "Solar Angle", unit: "deg" },
            { label: "Wind Velocity", unit: "m/s" },
            { label: "Grid Phase", unit: "sec" },
            { label: "Thermal Flux", unit: "W/m²" },
            { label: "Air Enthalpy", unit: "K" },
            { label: "Ion Density", unit: "cm³" }
        ];

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                fetchTelemetry();
            }
        }

        async function fetchTelemetry() {
            const location = document.getElementById('locationInput').value.trim() || "Abuja";
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = `Status: Resolving mesh for ${location}...`;

            try {
                const jitter = (Math.random() * 0.8 + 1.0).toFixed(3);
                const heap = (Math.random() * 10 + 30).toFixed(2);

                const response = await fetch(`${WORKER_URL}?location=${encodeURIComponent(location)}&jitter=${jitter}&heap=${heap}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                renderTelemetry(data);
                statusBar.textContent = `Status: Synced ${data.location} at ${new Date(data.timestamp).toLocaleTimeString()}`;
            } catch (err) {
                console.error("Fetch error:", err);
                statusBar.textContent = "Status: Error syncing with edge node.";
            }
        }

        function renderTelemetry(data) {
            const inPhoneContainer = document.getElementById('inPhoneList');
            inPhoneContainer.innerHTML = '';
            data.inPhone.forEach((val, index) => {
                const config = inPhoneConfig[index] || { label: `Entropy #${index+1}`, unit: "" };
                inPhoneContainer.innerHTML += `
                    <li class="vector-item">
                        <span class="vector-label">${config.label}</span>
                        <span class="vector-value">${val}<span class="unit">${config.unit}</span></span>
                    </li>
                `;
            });

            const offPhoneContainer = document.getElementById('offPhoneList');
            offPhoneContainer.innerHTML = '';
            data.offPhone.forEach((val, index) => {
                const config = offPhoneConfig[index] || { label: `Atmosphere #${index+1}`, unit: "" };
                offPhoneContainer.innerHTML += `
                    <li class="vector-item">
                        <span class="vector-label">${config.label}</span>
                        <span class="vector-value">${val}<span class="unit">${config.unit}</span></span>
                    </li>
                `;
            });
        }

        window.onload = fetchTelemetry;
    </script>
</body>
</html>
