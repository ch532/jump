<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltaic | Autonomous Telemetry Platform v2.0</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
            --alert-color: #f87171; --ok-color: #4ade80;
        }
        body { font-family: system-ui; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
      .container { width: 100%; max-width: 1000px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; gap: 15px; }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); letter-spacing: 0.05em; }
      .controls { display: flex; gap: 10px; align-items: center; }
        input[type="text"], button { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
        input:focus, button:hover { border-color: var(--accent-color); }
        button { cursor: pointer; font-weight: 600; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) {.grid { grid-template-columns: 1fr 1fr; } }
      .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        h2 { font-size: 1.1rem; margin: 0 0 16px 0; color: var(--accent-color); display: flex; justify-content: space-between; }
      .vector-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0; }
      .vector-item { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; text-align: center; transition: all 0.3s; }
      .vector-item.update { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(56,189,248,0.3); }
      .vector-label { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 4px; text-transform: uppercase; }
      .vector-value { font-size: 0.95rem; font-weight: 600; font-family: monospace; color: var(--text-main); }
      .unit { font-size: 0.75rem; color: var(--accent-color); margin-left: 2px; }
      .status-bar { font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; text-align: right; grid-column: 1 / -1; }
      .status-bar.ok { color: var(--ok-color); }.status-bar.alert { color: var(--alert-color); font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SOLTAIC TELEMETRY <span id="liveDot" style="color:var(--ok-color)">● LIVE</span></h1>
            <div class="controls">
                <input type="text" id="locationInput" value="Abuja" placeholder="Enter city/country...">
                <button onclick="fetchTelemetry(true)">Force Sync</button>
            </div>
        </header>

        <div class="grid">
            <div class="card"><h2>In-Phone Runtime Entropy <span id="inCount">10/10</span></h2><ul id="inPhoneList" class="vector-list"></ul></div>
            <div class="card"><h2>Off-Phone Atmospheric <span id="offCount">10/10</span></h2><ul id="offPhoneList" class="vector-list"></ul></div>
            <div id="statusBar" class="status-bar">Status: Booting mesh...</div>
        </div>
    </div>

<script>
const REFRESH_MS = 10000; // 10s auto refresh
let refreshInterval;

// 20 PARAMETERS - EXACTLY AS BEFORE
const inPhoneConfig = [
    { label: "Net Jitter", unit: "ms" }, { label: "Heap Alloc", unit: "MB" },
    { label: "CPU Load", unit: "%" }, { label: "Thread Skew", unit: "ms" },
    { label: "Battery Temp", unit: "°C" }, { label: "Signal RSSI", unit: "dBm" },
    { label: "IO Latency", unit: "ms" }, { label: "Sensor Drift", unit: "rad" },
    { label: "Voltage Rail", unit: "V" }, { label: "Entropy Pool", unit: "bits" }
];
const offPhoneConfig = [
    { label: "Geo Vector", unit: "rad" }, { label: "Baro Pressure", unit: "hPa" },
    { label: "Rel Humidity", unit: "%" }, { label: "Surface Trend", unit: "hPa" },
    { label: "Solar Angle", unit: "deg" }, { label: "Wind Velocity", unit: "m/s" },
    { label: "Grid Phase", unit: "sec" }, { label: "Thermal Flux", unit: "W/m²" },
    { label: "Air Enthalpy", unit: "K" }, { label: "Ion Density", unit: "cm³" }
];

const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

async function getDeviceData() {
    let batteryTemp = 38 + Math.random()*3;
    let voltage = 3.85;
    if (navigator.getBattery) {
        const b = await navigator.getBattery();
        voltage = (3.2 + b.level * 1.0).toFixed(2);
        if(b.charging) batteryTemp += 8;
    }
    let heap = "N/A";
    if (performance.memory) heap = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2);
    let rssi = navigator.connection? (navigator.connection.downlink < 1? -90 : -60) : -70;

    return [
        (Math.random() * 0.8 + 1.0).toFixed(3), // Net Jitter
        heap, // Heap Alloc
        (Math.random() * 4).toFixed(2), // CPU Load
        (performance.now() % 2).toFixed(3), // Thread Skew
        batteryTemp.toFixed(1), // Battery Temp
        rssi.toFixed(1), // Signal RSSI
        (performance.now() % 1.5).toFixed(2), // IO Latency
        (Math.random() * 2).toFixed(2), // Sensor Drift
        voltage, // Voltage Rail
        (Math.random() * 80 + 100).toFixed(0) // Entropy Pool
    ];
}

async function getAtmosphericData(location) {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1`);
    const geo = (await geoRes.json()).results[0];
    const { latitude, longitude, name, country } = geo;

    const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,wind_direction_10m&hourly=direct_radiation&timezone=auto`;
    const res = await fetch(weatherURL);
    const data = await res.json();
    const c = data.current; const h = data.hourly;

    const now = new Date();
    const hour = now.getHours() + now.getMinutes()/60;
    const solarAngle = clamp(90 - Math.abs(12 - hour) * 15, 0, 90);

    return {
        name: `${name}, ${country}`,
        values: [
            (c.wind_direction_10m * Math.PI / 180).toFixed(4), // Geo Vector
            clamp(c.pressure_msl, 800, 1100).toFixed(1), // Baro Pressure FIXED
            clamp(c.relative_humidity_2m, 0, 100).toFixed(2), // Rel Humidity CLAMPED
            ((Math.random() - 0.5) * 5).toFixed(2), // Surface Trend
            solarAngle.toFixed(2), // Solar Angle
            c.wind_speed_10m.toFixed(2), // Wind Velocity
            (Math.random() * 10 + 20).toFixed(2), // Grid Phase
            (-(h.direct_radiation[0] || 0) * 0.1).toFixed(1), // Thermal Flux
            (c.temperature_2m + 273.15).toFixed(2), // Air Enthalpy
            Math.floor(Math.random() * 150 + 20) // Ion Density
        ]
    };
}

async function fetchTelemetry(manual = false) {
    const location = document.getElementById('locationInput').value.trim() || "Abuja";
    if(!manual) document.getElementById('statusBar').innerHTML = `Status: Polling mesh for ${location}...`;

    try {
        const [inPhone, atmospheric] = await Promise.all([getDeviceData(), getAtmosphericData(location)]);
        renderList('inPhoneList', inPhone, inPhoneConfig);
        renderList('offPhoneList', atmospheric.values, offPhoneConfig);
        checkAlerts(inPhone);
        document.getElementById('statusBar').innerHTML = `Status: <span class="ok">Synced</span> ${atmospheric.name} at ${new Date().toLocaleTimeString()}`;
    } catch (err) {
        document.getElementById('statusBar').innerHTML = `<span class="alert">Status: Error - ${err.message}</span>`;
    }
}

function renderList(containerId, values, config) {
    const container = document.getElementById(containerId);
    if(container.children.length === 0) {
        container.innerHTML = values.map((val, i) => `
            <li class="vector-item">
                <span class="vector-label">${config[i].label}</span>
                <span class="vector-value">${val}<span class="unit">${config[i].unit}</span></span>
            </li>`).join('');
    } else {
        values.forEach((val, i) => {
            const el = container.children[i];
            const newText = `${val}${config[i].unit}`;
            if(el && el.querySelector('.vector-value').innerText!== newText){
                el.classList.add('update');
                el.querySelector('.vector-value').innerHTML = `${val}<span class="unit">${config[i].unit}</span>`;
                setTimeout(()=>el.classList.remove('update'), 600);
            }
        });
    }
}

function checkAlerts(inPhone) {
    const statusBar = document.getElementById('statusBar');
    const batteryTemp = parseFloat(inPhone[4]); const voltage = parseFloat(inPhone[8]);
    let alerts = [];
    if(batteryTemp > 55) alerts.push(`⚠️ Battery Hot: ${batteryTemp}°C`);
    if(voltage < 3.2) alerts.push(`⚠️ Low Voltage: ${voltage}V`);
    if(alerts.length > 0) statusBar.innerHTML += ` <span class="alert">| ${alerts.join(' | ')}</span>`;
}

// INIT + AUTO REFRESH
window.onload = () => {
    fetchTelemetry(true);
    refreshInterval = setInterval(fetchTelemetry, REFRESH_MS);
};
document.getElementById('locationInput').addEventListener('keypress', e => { if(e.key==='Enter') fetchTelemetry(true); });
</script>
</body>
</html>
