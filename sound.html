<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectgold Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; }
        
        /* Fixed Control Panel at Top */
        #operator-bar {
            height: 90px;
            background: #1e293b;
            border-bottom: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            gap: 15px;
            z-index: 9999;
            position: relative;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.75rem; color: #94a3b8; }
        .input-group input { padding: 6px 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; font-size: 0.85rem; width: 220px; }

        #listenBtn {
            background: #38bdf8; color: #0f172a; border: none; font-weight: bold;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        #listenBtn:hover { background: #0ea5e9; }

        #status-display { flex-grow: 1; font-size: 0.85rem; color: #cbd5e1; background: #0f172a; padding: 8px 12px; border-radius: 4px; border-left: 3px solid #38bdf8; }

        /* Fullscreen Target Website Container */
        #site-frame {
            width: 100%;
            height: calc(100vh - 90px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- CONTROL PANEL -->
    <div id="operator-bar">
        <div class="input-group">
            <label for="apiKey">BYOK Key (OpenRouter / Gemini)</label>
            <input type="password" id="apiKey" placeholder="sk-or-v1-... or AIzaSy...">
        </div>

        <button id="listenBtn" onclick="startVoiceOperator()">
            🎤 <span>Speak Command</span>
        </button>

        <div id="status-display">
            <strong>Status:</strong> <span id="agentStatus">Ready. Loaded target site: chyke.online</span><br>
            <strong>Instruction:</strong> <span id="lastTranscript" style="color: #94a3b8;">None</span>
        </div>
    </div>

    <!-- TARGET WEBSITE (chyke.online) -->
    <iframe id="site-frame" src="https://www.google.com" onload="onTargetSiteLoaded()"></iframe>

    <script>
        const frame = document.getElementById('site-frame');
        const statusEl = document.getElementById('agentStatus');
        const transcriptEl = document.getElementById('lastTranscript');

        function onTargetSiteLoaded() {
            console.log("Target site loaded into frame container.");
        }

        // 1. IN-AND-OUT DOM ANALYZER (Crawls the target site in real time)
        function analyzeTargetSiteDOM() {
            try {
                const targetDoc = frame.contentDocument || frame.contentWindow.document;
                const interactiveNodes = targetDoc.querySelectorAll('a, button, input, select, textarea, [role="button"]');
                const elementsMap = [];

                interactiveNodes.forEach((node, idx) => {
                    // Assign a temporary metadata tag if ID doesn't exist
                    if (!node.id) node.dataset.aiId = `ai_node_${idx}`;
                    
                    elementsMap.push({
                        selector_id: node.id ? `#${node.id}` : `[data-ai-id="${node.dataset.aiId}"]`,
                        tag: node.tagName.toLowerCase(),
                        type: node.type || "text",
                        text_content: (node.innerText || node.placeholder || node.value || "").trim().substring(0, 50),
                        href: node.href || null
                    });
                });

                return elementsMap;
            } catch (err) {
                console.error("Cross-origin or iframe frame access error:", err);
                return [];
            }
        }

        // 2. VOICE RECOGNITION LISTENER
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startVoiceOperator() {
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                statusEl.innerText = "Listening for your voice instruction...";
            };

            recognition.onresult = async (event) => {
                const voiceInstruction = event.results[0][0].transcript;
                transcriptEl.innerText = voiceInstruction;
                statusEl.innerText = "Analyzing target site & generating action plan...";
                
                await executeVoiceInstructionOnSite(voiceInstruction);
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Voice Recognition Error: " + e.error;
            };

            recognition.start();
        }

        // 3. AI AGENT DECISION ENGINE
        async function executeVoiceInstructionOnSite(instruction) {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert("Please enter your API Key in the top left BYOK field!");
                statusEl.innerText = "API key missing.";
                return;
            }

            // Perform in-and-out analysis of the live target website frame right now
            const liveDomMap = analyzeTargetSiteDOM();

            const systemPrompt = `You are an autonomous web operator AI controlling the live website inside the iframe container.
            The user gave this spoken instruction: "${instruction}"
            
            Here is the live analyzed DOM map of interactive elements on https://chyke.online:
            ${JSON.stringify(liveDomMap, null, 2)}
            
            Determine the sequential execution steps to satisfy the instruction completely.
            Respond ONLY with a raw JSON array (no markdown code blocks, no trailing commentary):
            [
              {
                "action": "type",
                "selector": "#searchBox or selector string",
                "value": "text to type",
                "spoken_response": "Typing text into the field"
              },
              {
                "action": "click",
                "selector": "selector string",
                "spoken_response": "Clicking button now"
              },
              {
                "action": "navigate",
                "url": "https://chyke.online/target-page",
                "spoken_response": "Navigating to page"
              }
            ]`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.5-flash",
                        messages: [{ role: "user", content: systemPrompt }],
                        temperature: 0.1
                    })
                });

                const data = await response.json();
                const rawResponse = data.choices[0].message.content;
                const cleanJson = rawResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                const actionQueue = JSON.parse(cleanJson);

                await runDOMActionsOnTargetSite(actionQueue);

            } catch (error) {
                console.error(error);
                statusEl.innerText = "AI Execution Failed. Check API Key or Console.";
            }
        }

        // 4. REAL DOM MUTATION ENGINE ON CHYKE.ONLINE
        async function runDOMActionsOnTargetSite(actions) {
            const targetDoc = frame.contentDocument || frame.contentWindow.document;

            for (const step of actions) {
                statusEl.innerText = step.spoken_response;

                // Audio feedback out loud
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(step.spoken_response);
                    window.speechSynthesis.speak(utterance);
                }

                if (step.action === "navigate") {
                    frame.src = step.url;
                    await new Promise(r => setTimeout(r, 2500)); // Wait for page transition
                    continue;
                }

                const element = targetDoc.querySelector(step.selector);
                if (element) {
                    if (step.action === "type") {
                        element.value = step.value;
                        element.dispatchEvent(new Event('input', { bubbles: true }));
                        element.dispatchEvent(new Event('change', { bubbles: true }));
                    } else if (step.action === "click") {
                        element.click();
                    }
                }
                
                // Small delay between multiple actions
                await new Promise(r => setTimeout(r, 800));
            }

            statusEl.innerText = "Instruction completed successfully on target site!";
        }
    </script>
</body>
</html>
