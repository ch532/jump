<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectgold Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
        #operator-bar {
            height: 90px; background: #1e293b; border-bottom: 2px solid #38bdf8;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; gap: 15px; z-index: 9999; position: relative;
        }
        #listenBtn {
            background: #38bdf8; color: #0f172a; border: none; font-weight: bold;
            padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 0.95rem;
        }
        #listenBtn:disabled { background: #64748b; cursor: not-allowed; }
        #status-display { flex-grow: 1; font-size: 0.85rem; color: #cbd5e1; background: #0f172a; padding: 10px; border-radius: 4px; border-left: 3px solid #38bdf8; }
        #site-frame { width: 100%; height: calc(100vh - 90px); border: none; }
    </style>
    <!-- Load Hugging Face Transformers.js locally into browser -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.tfPipeline = pipeline;
        env.allowLocalModels = false;
    </script>
</head>
<body>

    <div id="operator-bar">
        <button id="listenBtn" onclick="startVoiceOperator()" disabled>
            ⌛ Loading Local AI Model...
        </button>

        <div id="status-display">
            <strong>Status:</strong> <span id="agentStatus">Initializing local browser AI engine...</span><br>
            <strong>Instruction:</strong> <span id="lastTranscript" style="color: #94a3b8;">None</span>
        </div>
    </div>

    <!-- TARGET WEBSITE FRAME -->
    <iframe id="site-frame" src="https://chyke.online"></iframe>

    <script>
        let generator = null;
        const statusEl = document.getElementById('agentStatus');
        const transcriptEl = document.getElementById('lastTranscript');
        const listenBtn = document.getElementById('listenBtn');
        const frame = document.getElementById('site-frame');

        // Initialize Local In-Browser AI Engine on Page Load
        window.addEventListener('load', async () => {
            try {
                // Load lightweight local instruction model directly in browser memory
                generator = await window.tfPipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                statusEl.innerText = "Local AI Engine ready! No API keys required.";
                listenBtn.innerText = "🎤 Speak Command";
                listenBtn.disabled = false;
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Failed to load local model. Check internet connection.";
            }
        });

        // 1. IN-AND-OUT DOM SCANNER
        function analyzeTargetSiteDOM() {
            try {
                const targetDoc = frame.contentDocument || frame.contentWindow.document;
                const interactiveNodes = targetDoc.querySelectorAll('a, button, input, select, textarea');
                const elementsMap = [];

                interactiveNodes.forEach((node, idx) => {
                    if (!node.id) node.dataset.aiId = `ai_node_${idx}`;
                    elementsMap.push({
                        selector: node.id ? `#${node.id}` : `[data-ai-id="${node.dataset.aiId}"]`,
                        tag: node.tagName.toLowerCase(),
                        type: node.type || "text",
                        label: (node.innerText || node.placeholder || node.value || "").trim().substring(0, 30)
                    });
                });
                return elementsMap;
            } catch (e) {
                return [];
            }
        }

        // 2. VOICE RECOGNITION
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startVoiceOperator() {
            if (!SpeechRecognition) {
                alert("Speech recognition requires Chrome or Edge browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.onstart = () => { statusEl.innerText = "Listening to voice instruction..."; };
            
            recognition.onresult = async (event) => {
                const voiceInstruction = event.results[0][0].transcript;
                transcriptEl.innerText = voiceInstruction;
                statusEl.innerText = "Local AI analyzing DOM and planning execution...";
                
                await runLocalAIExecution(voiceInstruction);
            };

            recognition.start();
        }

        // 3. EXECUTE VIA LOCAL IN-BROWSER AI
        async function runLocalAIExecution(instruction) {
            const liveDomMap = analyzeTargetSiteDOM();

            const prompt = `<|im_start|>system
You are a web operator AI. Look at DOM map: ${JSON.stringify(liveDomMap)}.
Spoken instruction: "${instruction}".
Return JSON action format: [{"action":"type"|"click","selector":"#id","value":"text","spoken_response":"phrase"}]<|im_end|>
<|im_start|>user
Execute instruction.<|im_end|>
<|im_start|>assistant\n`;

            try {
                // Generate execution plan locally in browser CPU/GPU
                const output = await generator(prompt, { max_new_tokens: 150, temperature: 0.1 });
                const generatedText = output[0].generated_text.split('<|im_start|>assistant\n')[1] || "";
                
                const cleanJson = generatedText.substring(generatedText.indexOf('['), generatedText.lastIndexOf(']') + 1);
                const actionQueue = JSON.parse(cleanJson);

                executeDOMActions(actionQueue);
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Local execution error. Please try a simpler instruction.";
            }
        }

        // 4. APPLY MUTATIONS TO CHYKE.ONLINE
        function executeDOMActions(actions) {
            const targetDoc = frame.contentDocument || frame.contentWindow.document;

            actions.forEach(step => {
                statusEl.innerText = step.spoken_response;

                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(step.spoken_response);
                    window.speechSynthesis.speak(utterance);
                }

                const element = targetDoc.querySelector(step.selector);
                if (element) {
                    if (step.action === "type") {
                        element.value = step.value;
                        element.dispatchEvent(new Event('input', { bubbles: true }));
                    } else if (step.action === "click") {
                        element.click();
                    }
                }
            });
        }
    </script>
</body>
</html>
