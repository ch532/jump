<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectgold Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
        #operator-bar {
            height: 90px; background: #1e293b; border-bottom: 2px solid #38bdf8;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; gap: 15px; z-index: 9999; position: relative;
        }
        #listenBtn {
            background: #38bdf8; color: #0f172a; border: none; font-weight: bold;
            padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 0.95rem;
        }
        #listenBtn:hover { background: #0ea5e9; }
        #status-display { flex-grow: 1; font-size: 0.85rem; color: #cbd5e1; background: #0f172a; padding: 10px; border-radius: 4px; border-left: 3px solid #38bdf8; }
        #site-frame { width: 100%; height: calc(100vh - 90px); border: none; }
    </style>
</head>
<body>

    <div id="operator-bar">
        <button id="listenBtn" onclick="startVoiceOperator()">
            🎤 Speak Command
        </button>

        <div id="status-display">
            <strong>Status:</strong> <span id="agentStatus">Connected to Cloudflare AI Worker. Ready!</span><br>
            <strong>Instruction:</strong> <span id="lastTranscript" style="color: #94a3b8;">None</span>
        </div>
    </div>

    <!-- TARGET WEBSITE FRAME -->
    <iframe id="site-frame" src="https://chyke.online"></iframe>

    <script>
        const statusEl = document.getElementById('agentStatus');
        const transcriptEl = document.getElementById('lastTranscript');
        const frame = document.getElementById('site-frame');

        // 1. IN-AND-OUT DOM SCANNER FOR CHYKE.ONLINE
        function analyzeTargetSiteDOM() {
            try {
                const targetDoc = frame.contentDocument || frame.contentWindow.document;
                const interactiveNodes = targetDoc.querySelectorAll('a, button, input, select, textarea');
                const elementsMap = [];

                interactiveNodes.forEach((node, idx) => {
                    if (!node.id) node.dataset.aiId = `ai_node_${idx}`;
                    elementsMap.push({
                        selector: node.id ? `#${node.id}` : `[data-ai-id="${node.dataset.aiId}"]`,
                        tag: node.tagName.toLowerCase(),
                        type: node.type || "text",
                        label: (node.innerText || node.placeholder || node.value || "").trim().substring(0, 30)
                    });
                });
                return elementsMap;
            } catch (e) {
                console.error("DOM Scan restricted by cross-origin rules if domains differ.", e);
                return [];
            }
        }

        // 2. VOICE RECOGNITION
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startVoiceOperator() {
            if (!SpeechRecognition) {
                alert("Speech recognition requires Chrome or Edge browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.onstart = () => { statusEl.innerText = "Listening to voice instruction..."; };
            
            recognition.onresult = async (event) => {
                const voiceInstruction = event.results[0][0].transcript;
                transcriptEl.innerText = voiceInstruction;
                statusEl.innerText = "Sending instruction to your Cloudflare Worker AI...";
                
                await sendToCloudflareWorker(voiceInstruction);
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Voice recognition error: " + e.error;
            };

            recognition.start();
        }

        // 3. SEND TO YOUR CLOUDERS WORKER BACKEND
        async function sendToCloudflareWorker(instruction) {
            const liveDomMap = analyzeTargetSiteDOM();

            try {
                const response = await fetch("https://withered-block-9506.trustconnect713.workers.dev/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ instruction, domMap: liveDomMap })
                });

                const data = await response.json();
                
                // Cloudflare Workers AI response parser
                let rawContent = "";
                if (data.response) {
                    rawContent = data.response;
                } else if (typeof data === 'string') {
                    rawContent = data;
                } else {
                    rawContent = JSON.stringify(data);
                }

                // Clean up markdown formatting if the model wraps the JSON
                const cleanJson = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
                const actionQueue = JSON.parse(cleanJson);

                executeDOMActions(actionQueue);
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Execution error. Check console or worker logs.";
            }
        }

        // 4. APPLY MUTATIONS TO CHYKE.ONLINE
        function executeDOMActions(actions) {
            const targetDoc = frame.contentDocument || frame.contentWindow.document;

            actions.forEach(step => {
                statusEl.innerText = step.spoken_response;

                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(step.spoken_response);
                    window.speechSynthesis.speak(utterance);
                }

                const element = targetDoc.querySelector(step.selector);
                if (element) {
                    if (step.action === "type") {
                        element.value = step.value;
                        element.dispatchEvent(new Event('input', { bubbles: true }));
                        element.dispatchEvent(new Event('change', { bubbles: true }));
                    } else if (step.action === "click") {
                        element.click();
                    }
                }
            });
            statusEl.innerText = "Instruction executed successfully!";
        }
    </script>
</body>
</html>
