<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connectgold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070709;color:#fff;font-family:ui-sans-system;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#header{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #1a1a1f;flex-shrink:0}
#header img{width:38px;height:38px;border-radius:12px;background:#111;padding:4px;border:1px solid #c9a86a44}
#header b{font-size:16px;letter-spacing:2px;font-weight:700}
#header b span{color:#c9a86a}
#live{margin-left:auto;width:8px;height:8px;background:#c9a86a;border-radius:50%;box-shadow:0 0 12px #c9a86a}
#flow{flex:1;overflow-y:auto;padding:40px 24px 20px;display:flex;flex-direction:column;gap:28px}
.item{max-width:640px;width:100%;margin:0 auto}
.item.user{border-left:2px solid #c9a86a;padding-left:18px;color:#e8e0d0}
.item.ai{display:flex;gap:16px}
.item.ai .orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f3d58a,#c9a86a,#8a6a2a);flex-shrink:0;box-shadow:0 0 20px #c9a86a55}
.item.ai .content{padding-top:8px;font-size:15px;line-height:1.8;color:#d8d2c5;white-space:pre-wrap}
#dock{padding:12px 20px 90px;background:#070709;flex-shrink:0;border-top:1px solid #14141a}
#pill{max-width:680px;margin:0 auto;background:#121216;border:1px solid #23232a;border-radius:999px;display:flex;align-items:center;padding:8px 8px 8px 22px;gap:10px;transform:translateY(-18px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
#pill:focus-within{border-color:#c9a86a;box-shadow:0 0 0 4px #c9a86a1a,0 10px 30px rgba(0,0,0,.6)}
#q{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;padding:8px 0}
#q::placeholder{color:#5a5a62}
.circle{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mic{background:#1e1e24;color:#c9a86a}
#mic.on{background:#c9a86a;color:#000}
#go{background:#c9a86a;color:#000;font-weight:700}
#clip{background:transparent;color:#666;border:1px solid #23232a}
</style>
</head>
<body>
<div id="header"><img src="https://chyke.online/connectgold_2.png"><b>CONNECT<span>GOLD</span></b><div id="live"></div></div>

<div id="flow">
<div class="item ai"><div class="orb"></div><div class="content">I am Connectgold. Speak or type.</div></div>
</div>

<div id="dock">
<div id="pill">
<input id="q" placeholder="Ask Connectgold anything...">
<button id="clip" class="circle">+</button>
<button id="mic" class="circle">◍</button>
<button id="go" class="circle">↗</button>
<input type="file" id="f" hidden accept=".pdf,.jpg,.jpeg,.png,.webp,.txt,.csv,.json">
</div>
</div>

<script>
const WORKER="https://small-fire-08e0.trustconnect713.workers.dev";
const flow=document.getElementById('flow'), q=document.getElementById('q');
function push(role,t){
  const d=document.createElement('div');
  d.className='item '+role;
  if(role==='user'){d.textContent=t}
  else{d.innerHTML=`<div class="orb"></div><div class="content"></div>`; d.querySelector('.content').textContent=t}
  flow.appendChild(d); flow.scrollTop=flow.scrollHeight;
  return role==='ai'?d.querySelector('.content'):d;
}
async function ask(txt){
  if(!txt.trim())return;
  push('user',txt); q.value='';
  const out=push('ai','');
  try{
    const r=await fetch(`${WORKER}/api/research`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:txt})});
    const j=await r.json(); out.textContent=j.answer||j.error; speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance((j.answer||'').slice(0,450)));
  }catch(e){out.textContent=e.message}
}
document.getElementById('go').onclick=()=>ask(q.value);
q.onkeydown=e=>{if(e.key==='Enter')ask(q.value)};
document.getElementById('clip').onclick=()=>document.getElementById('f').click();
document.getElementById('f').onchange=async e=>{
  const file=e.target.files[0]; if(!file)return;
  if(/\.(mp3|m4a|mp4|mov|avi|mkv)$/i.test(file.name)){alert('Use mic, not file');return;}
  push('user',file.name);
  const out=push('ai','Reading...');
  const fd=new FormData(); fd.append('file',file); fd.append('query','Summarize');
  const r=await fetch(`${WORKER}/api/upload-all`,{method:'POST',body:fd});
  const j=await r.json(); out.textContent=j.result||j.error;
};
let rec,chunks=[],on=false;
document.getElementById('mic').onclick=async function(){
  if(!on){
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(s); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async ()=>{
      const fd=new FormData(); fd.append('audio',new Blob(chunks,{type:'audio/webm'}),'v.webm');
      const r=await fetch(`${WORKER}/api/voice`,{method:'POST',body:fd});
      const j=await r.json(); push('user',j.transcript); push('ai',j.answer);
    };
    rec.start(); on=true; this.classList.add('on');
  }else{rec.stop(); on=false; this.classList.remove('on');}
};
</script>
</body>
</html>
